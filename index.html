<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>88 GARAGE - แอปผู้เช่าและแอดมิน</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #18181b; color: white; -webkit-tap-highlight-color: transparent; }
        .glass-panel { background: rgba(39, 39, 42, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const App = () => {
            // -- State สำหรับการ Login --
            const [currentUser, setCurrentUser] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);
            
            // -- State หลักของระบบ --
            const [gasUrl, setGasUrl] = useState(localStorage.getItem('gasUrl') || '');
            const [users, setUsers] = useState([]); // เก็บรายชื่อร้านค้า
            const [repairs, setRepairs] = useState([]); // เก็บงานแจ้งซ่อม
            const [announcements, setAnnouncements] = useState([]); // ประกาศ
            const [receipts, setReceipts] = useState([]); // ขอใบเสร็จ
            const [meterData, setMeterData] = useState({}); // ข้อมูลมิเตอร์และบิล
            
            // -- State สำหรับ UI --
            const [toast, setToast] = useState(null);
            const [isSyncing, setIsSyncing] = useState(false);
            
            // ฟังก์ชันช่วยเหลือ: แจ้งเตือน Toast
            const showToast = (msg, type = 'info') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 3000);
            };

            // ฟังก์ชันดึงข้อมูลจาก Google Sheets
            const fetchFromGoogleSheets = async () => {
                if (!gasUrl) return;
                setIsSyncing(true);
                try {
                    const res = await fetch(gasUrl);
                    const json = await res.json();
                    if (json.status === 'success') {
                        if (json.stores) setUsers(json.stores);
                        if (json.repairs) setRepairs(json.repairs.reverse()); // ล่าสุดขึ้นก่อน
                        if (json.announcements) setAnnouncements(json.announcements.reverse());
                        if (json.receipts) setReceipts(json.receipts.reverse());
                        
                        // แกะข้อมูลบิล
                        if (json.data) {
                            const newMeters = {};
                            json.data.forEach(row => {
                                const stall = row.stallNumber || row.StallNumber;
                                if (stall) {
                                    newMeters[stall] = { 
                                        water: Number(row.waterUnits || row["หน่วยค่าน้ำ"] || 0), 
                                        electric: Number(row.electricUnits || row["หน่วยค่าไฟ"] || 0), 
                                        status: row.status || row.Status || 'ค้างชำระ',
                                        rent: Number(row.rent || row["ค่าเช่าร้าน"] || 0),
                                        total: Number(row.totalAmount || row["ยอดรวม"] || 0)
                                    };
                                }
                            });
                            setMeterData(newMeters);
                        }
                        showToast("อัปเดตข้อมูลจากระบบเรียบร้อย", "success");
                    }
                } catch (err) {
                    console.error(err);
                    showToast("ไม่สามารถดึงข้อมูลได้ กรุณาตรวจสอบ URL", "error");
                } finally {
                    setIsSyncing(false);
                }
            };

            // ดึงข้อมูลครั้งแรกเมื่อใส่ URL หรือเปิดแอป
            useEffect(() => {
                if (gasUrl) {
                    localStorage.setItem('gasUrl', gasUrl);
                    fetchFromGoogleSheets();
                }
            }, [gasUrl]);

            // ฟังก์ชันบันทึกข้อมูลไป Google Sheets
            const syncToGoogleSheets = async (payload, actionType) => {
                if (!gasUrl) {
                    showToast("กรุณาตั้งค่า Google Sheets URL ในหน้า Admin ก่อน", "error");
                    return;
                }
                setIsSyncing(true);
                try {
                    // กรองรูปภาพออก ป้องกัน Error Payload Too Large จาก Google Sheet
                    const cleanPayload = payload.map(item => {
                        const cleanItem = { ...item };
                        if (cleanItem.tenantPhoto) cleanItem.tenantPhoto = "[แนบรูปภาพ - ดูผ่านแอป]";
                        if (cleanItem.adminPhoto) cleanItem.adminPhoto = "[แนบรูปภาพ - ดูผ่านแอป]";
                        if (cleanItem.slipPhoto) cleanItem.slipPhoto = "[แนบสลิป - ดูผ่านแอป]";
                        return cleanItem;
                    });

                    await fetch(gasUrl, { 
                        method: 'POST', 
                        mode: 'no-cors', // สำคัญ: เพื่อไม่ให้ติด Block CORS
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
                        body: JSON.stringify({ action: actionType, items: cleanPayload }) 
                    });
                    
                    showToast("บันทึกข้อมูลเข้าระบบเรียบร้อย", "success");
                } catch (err) {
                    console.error(err);
                    showToast("เกิดข้อผิดพลาดในการบันทึก", "error");
                } finally {
                    setIsSyncing(false);
                }
            };

            if (!currentUser && !isAdmin) {
                return <LoginView 
                    users={users} 
                    onLoginTenant={(u) => setCurrentUser(u)}
                    onLoginAdmin={() => setIsAdmin(true)}
                    showToast={showToast}
                />;
            }

            const pendingRepairsCount = repairs.filter(r => r.status === 'รอดำเนินการ').length;

            return (
                <div className="min-h-screen pb-20 bg-zinc-900 text-zinc-100">
                    {/* Header */}
                    <div className="sticky top-0 z-40 bg-zinc-950/80 backdrop-blur-md border-b border-white/10 px-4 py-3 flex justify-between items-center">
                        <div className="flex items-center gap-2">
                            <div className="w-8 h-8 bg-yellow-500 rounded flex items-center justify-center font-black text-black">88</div>
                            <div>
                                <h1 className="text-sm font-bold leading-none">88 GARAGE</h1>
                                <p className="text-[10px] text-zinc-400">{isAdmin ? 'Admin Dashboard' : `ล็อค ${currentUser.stallNumber} - ${currentUser.name}`}</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-3">
                            {isSyncing && <div className="w-4 h-4 border-2 border-yellow-500 border-t-transparent rounded-full animate-spin"></div>}
                            <button onClick={() => { setCurrentUser(null); setIsAdmin(false); }} className="p-2 bg-red-500/10 text-red-400 rounded-lg text-xs font-bold">
                                ออกจากระบบ
                            </button>
                        </div>
                    </div>

                    {/* Content Area */}
                    <div className="p-4 max-w-lg mx-auto">
                        {isAdmin ? (
                            <AdminDashboard 
                                gasUrl={gasUrl} setGasUrl={setGasUrl} fetchFromGoogleSheets={fetchFromGoogleSheets}
                                users={users} setUsers={setUsers} syncToGoogleSheets={syncToGoogleSheets} showToast={showToast}
                                repairs={repairs} setRepairs={setRepairs}
                                announcements={announcements} setAnnouncements={setAnnouncements}
                                pendingRepairsCount={pendingRepairsCount}
                            />
                        ) : (
                            <TenantDashboard 
                                currentUser={currentUser} 
                                repairs={repairs} setRepairs={setRepairs} syncToGoogleSheets={syncToGoogleSheets} showToast={showToast}
                                announcements={announcements}
                            />
                        )}
                    </div>

                    {/* Toast Notification */}
                    {toast && (
                        <div className={`fixed top-16 left-1/2 transform -translate-x-1/2 z-50 px-4 py-2 rounded-full shadow-xl text-sm font-medium animate-bounce ${toast.type === 'error' ? 'bg-red-500 text-white' : 'bg-green-500 text-white'}`}>
                            {toast.msg}
                        </div>
                    )}
                </div>
            );
        };

        const LoginView = ({ users, onLoginTenant, onLoginAdmin, showToast }) => {
            const [mode, setMode] = useState('tenant'); // 'tenant' | 'admin'
            const [stall, setStall] = useState('');
            const [password, setPassword] = useState('');

            const handleLogin = (e) => {
                e.preventDefault();
                if (mode === 'admin') {
                    if (password === '887799') onLoginAdmin();
                    else showToast('รหัสผ่าน Admin ไม่ถูกต้อง', 'error');
                } else {
                    const user = users.find(u => u.stallNumber.toLowerCase() === stall.toLowerCase() && u.password === password);
                    if (user) onLoginTenant(user);
                    else showToast('ไม่พบข้อมูลล็อค หรือรหัสผ่านผิด', 'error');
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4 bg-zinc-950">
                    <div className="w-full max-w-sm glass-panel rounded-2xl p-6">
                        <div className="text-center mb-8">
                            <div className="w-16 h-16 bg-yellow-500 rounded-2xl mx-auto flex items-center justify-center text-3xl font-black text-black mb-4 shadow-[0_0_20px_rgba(234,179,8,0.3)]">88</div>
                            <h1 className="text-2xl font-black text-white tracking-wider">GARAGE</h1>
                            <p className="text-zinc-400 text-sm">ระบบจัดการพื้นที่เช่า</p>
                        </div>

                        <div className="flex bg-zinc-900 rounded-lg p-1 mb-6">
                            <button onClick={() => setMode('tenant')} className={`flex-1 py-2 text-sm font-bold rounded-md transition-all ${mode === 'tenant' ? 'bg-zinc-700 text-white shadow' : 'text-zinc-500'}`}>ผู้เช่า</button>
                            <button onClick={() => setMode('admin')} className={`flex-1 py-2 text-sm font-bold rounded-md transition-all ${mode === 'admin' ? 'bg-zinc-700 text-white shadow' : 'text-zinc-500'}`}>แอดมิน</button>
                        </div>

                        <form onSubmit={handleLogin} className="space-y-4">
                            {mode === 'tenant' && (
                                <div>
                                    <label className="text-xs text-zinc-400 font-medium mb-1 block">หมายเลขล็อค (เช่น A-01)</label>
                                    <input type="text" value={stall} onChange={e => setStall(e.target.value)} className="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-yellow-500" placeholder="A-01" required />
                                </div>
                            )}
                            <div>
                                <label className="text-xs text-zinc-400 font-medium mb-1 block">รหัสผ่าน</label>
                                <input type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-yellow-500" placeholder="••••••••" required />
                            </div>
                            <button type="submit" className="w-full bg-yellow-500 text-black font-bold py-3 rounded-xl hover:bg-yellow-400 transition-colors mt-2">
                                เข้าสู่ระบบ
                            </button>
                        </form>
                        
                        {mode === 'tenant' && users.length === 0 && (
                            <p className="text-xs text-center text-red-400 mt-4 bg-red-900/20 p-2 rounded">ยังไม่มีฐานข้อมูลร้านค้า กรุณาให้ Admin ลงทะเบียนร้านค้าและตั้งค่าระบบให้ก่อน</p>
                        )}
                    </div>
                </div>
            );
        };

        const AdminDashboard = ({ gasUrl, setGasUrl, fetchFromGoogleSheets, users, setUsers, syncToGoogleSheets, showToast, repairs, setRepairs, announcements, setAnnouncements, pendingRepairsCount }) => {
            const [tab, setTab] = useState('stores');
            
            // For Store Management
            const [newStore, setNewStore] = useState({ stallNumber: '', name: '', password: '', rent: '' });

            const handleAddStore = (e) => {
                e.preventDefault();
                if(!newStore.stallNumber || !newStore.name) return showToast("กรอกข้อมูลล็อคและชื่อร้านให้ครบ", "error");
                
                const updatedUsers = [...users, { ...newStore, id: Date.now() }];
                setUsers(updatedUsers);
                syncToGoogleSheets(updatedUsers, 'save_stores');
                setNewStore({ stallNumber: '', name: '', password: '', rent: '' });
                showToast("เพิ่มร้านค้าและบันทึกลง Sheet แล้ว", "success");
            };

            return (
                <div className="space-y-4">
                    {/* Admin Nav */}
                    <div className="flex overflow-x-auto hide-scrollbar gap-2 pb-2">
                        <NavBtn active={tab==='stores'} onClick={() => setTab('stores')} icon="🏪" text="จัดการร้าน" />
                        <NavBtn active={tab==='repairs'} onClick={() => setTab('repairs')} icon="🛠️" text="งานซ่อม" badge={pendingRepairsCount} />
                        <NavBtn active={tab==='announcements'} onClick={() => setTab('announcements')} icon="📢" text="ประกาศ" />
                        <NavBtn active={tab==='settings'} onClick={() => setTab('settings')} icon="⚙️" text="ระบบ" />
                    </div>

                    {/* Settings Tab */}
                    {tab === 'settings' && (
                        <div className="glass-panel p-4 rounded-xl space-y-4">
                            <h2 className="font-bold text-yellow-500">การเชื่อมต่อ Google Sheets</h2>
                            <p className="text-xs text-zinc-400">ใส่ Web App URL ที่ได้จาก Google Apps Script เพื่อให้แอปบันทึกข้อมูลลง Sheet อัตโนมัติ</p>
                            <input 
                                type="text" 
                                value={gasUrl} 
                                onChange={e => setGasUrl(e.target.value)} 
                                placeholder="https://script.google.com/macros/s/.../exec"
                                className="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white"
                            />
                            <button onClick={fetchFromGoogleSheets} className="w-full bg-zinc-700 text-white font-bold py-2 rounded-lg text-sm">
                                บันทึกและดึงข้อมูลล่าสุด
                            </button>
                        </div>
                    )}

                    {/* Stores Tab */}
                    {tab === 'stores' && (
                        <div className="space-y-4">
                            <form onSubmit={handleAddStore} className="glass-panel p-4 rounded-xl space-y-3">
                                <h2 className="font-bold text-yellow-500">ลงทะเบียนร้านค้าใหม่</h2>
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="text-xs text-zinc-400">หมายเลขล็อค</label>
                                        <input type="text" required value={newStore.stallNumber} onChange={e=>setNewStore({...newStore, stallNumber: e.target.value})} className="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm" placeholder="A-01" />
                                    </div>
                                    <div>
                                        <label className="text-xs text-zinc-400">ชื่อร้าน</label>
                                        <input type="text" required value={newStore.name} onChange={e=>setNewStore({...newStore, name: e.target.value})} className="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm" placeholder="ร้านเจ๊ง้อ" />
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="text-xs text-zinc-400">รหัสผ่าน (ให้ผู้เช่า)</label>
                                        <input type="text" required value={newStore.password} onChange={e=>setNewStore({...newStore, password: e.target.value})} className="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm" placeholder="1234" />
                                    </div>
                                    <div>
                                        <label className="text-xs text-zinc-400">ค่าเช่าพื้นฐาน</label>
                                        <input type="number" required value={newStore.rent} onChange={e=>setNewStore({...newStore, rent: e.target.value})} className="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm" placeholder="3000" />
                                    </div>
                                </div>
                                <button type="submit" className="w-full bg-yellow-500 text-black font-bold py-2 rounded-lg text-sm">เพิ่มร้านค้า</button>
                            </form>

                            <div className="glass-panel p-4 rounded-xl">
                                <h2 className="font-bold text-yellow-500 mb-3">รายชื่อร้านค้า ({users.length})</h2>
                                {users.length === 0 ? <p className="text-sm text-zinc-500 text-center py-4">ยังไม่มีร้านค้า</p> : (
                                    <div className="space-y-2">
                                        {users.map((u, i) => (
                                            <div key={i} className="bg-zinc-900 p-3 rounded-lg flex justify-between items-center border border-zinc-800">
                                                <div>
                                                    <div className="font-bold text-sm text-white">{u.stallNumber} - {u.name}</div>
                                                    <div className="text-xs text-zinc-400">รหัสผ่าน: {u.password} | ค่าเช่า: ฿{Number(u.rent||0).toLocaleString()}</div>
                                                </div>
                                                <button onClick={() => {
                                                    const updated = users.filter(x => x.stallNumber !== u.stallNumber);
                                                    setUsers(updated);
                                                    syncToGoogleSheets(updated, 'save_stores');
                                                }} className="text-xs text-red-500 font-bold bg-red-500/10 px-2 py-1 rounded">ลบ</button>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Repairs Tab */}
                    {tab === 'repairs' && (
                        <div className="space-y-4">
                            <h2 className="font-bold text-yellow-500">จัดการงานแจ้งซ่อม</h2>
                            {repairs.length === 0 ? <p className="text-sm text-zinc-500 text-center py-4">ไม่มีรายการแจ้งซ่อม</p> : (
                                <div className="space-y-3">
                                    {repairs.map(r => (
                                        <div key={r.id} className="glass-panel p-4 rounded-xl border border-zinc-700 space-y-2">
                                            <div className="flex justify-between items-start">
                                                <div>
                                                    <span className={`text-[10px] font-black px-2 py-0.5 rounded-full ${r.status === 'รอดำเนินการ' ? 'bg-red-500/20 text-red-400' : r.status === 'กำลังดำเนินการ' ? 'bg-yellow-500/20 text-yellow-400' : 'bg-green-500/20 text-green-400'}`}>
                                                        {r.status}
                                                    </span>
                                                    <div className="font-bold text-sm mt-1">ล็อค {r.stallNumber}</div>
                                                    <div className="text-xs text-zinc-400">{r.date}</div>
                                                </div>
                                            </div>
                                            <p className="text-sm bg-zinc-900 p-2 rounded">{r.desc}</p>
                                            
                                            {/* Admin Actions */}
                                            <div className="pt-2 mt-2 border-t border-zinc-700 flex gap-2">
                                                <select 
                                                    value={r.status}
                                                    onChange={(e) => {
                                                        const updated = repairs.map(x => x.id === r.id ? {...x, status: e.target.value} : x);
                                                        setRepairs(updated);
                                                        syncToGoogleSheets(updated, 'save_repairs');
                                                    }}
                                                    className="bg-zinc-800 text-xs rounded px-2 py-1 flex-1 border border-zinc-600 outline-none"
                                                >
                                                    <option value="รอดำเนินการ">รอดำเนินการ</option>
                                                    <option value="กำลังดำเนินการ">กำลังดำเนินการ</option>
                                                    <option value="แก้ไขแล้ว">แก้ไขแล้ว</option>
                                                </select>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}

                    {/* Announcements Tab */}
                    {tab === 'announcements' && (
                        <div className="space-y-4">
                            <form onSubmit={(e) => {
                                e.preventDefault();
                                const title = e.target.title.value;
                                const desc = e.target.desc.value;
                                if(!title || !desc) return;
                                const updated = [{id: Date.now(), title, desc, date: new Date().toLocaleDateString('th-TH')}, ...announcements];
                                setAnnouncements(updated);
                                syncToGoogleSheets(updated, 'save_announcements');
                                e.target.reset();
                                showToast('ลงประกาศแล้ว', 'success');
                            }} className="glass-panel p-4 rounded-xl space-y-3">
                                <h2 className="font-bold text-yellow-500">สร้างประกาศใหม่</h2>
                                <input name="title" required placeholder="หัวข้อประกาศ" className="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm" />
                                <textarea name="desc" required placeholder="รายละเอียด..." rows="3" className="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm"></textarea>
                                <button type="submit" className="w-full bg-yellow-500 text-black font-bold py-2 rounded-lg text-sm">ส่งประกาศ</button>
                            </form>
                        </div>
                    )}
                </div>
            );
        };

        const TenantDashboard = ({ currentUser, repairs, setRepairs, syncToGoogleSheets, showToast, announcements }) => {
            const [tab, setTab] = useState('home');
            
            // For Repair form
            const [desc, setDesc] = useState('');

            const handleRepairSubmit = (e) => {
                e.preventDefault();
                if (!desc) return showToast('กรุณากรอกรายละเอียด', 'error');
                
                const newRepair = {
                    id: Date.now(),
                    stallNumber: currentUser.stallNumber,
                    name: currentUser.name,
                    desc: desc,
                    status: 'รอดำเนินการ',
                    date: new Date().toLocaleString('th-TH')
                };
                
                const updatedRepairs = [newRepair, ...repairs];
                setRepairs(updatedRepairs);
                syncToGoogleSheets(updatedRepairs, 'save_repairs');
                setDesc('');
                showToast('ส่งเรื่องแจ้งซ่อมเรียบร้อย แอดมินได้รับข้อมูลแล้ว', 'success');
                setTab('myrepairs'); // ย้ายไปหน้าประวัติ
            };

            const myRepairs = repairs.filter(r => r.stallNumber === currentUser.stallNumber);

            return (
                <div className="space-y-4">
                    {/* Tenant Nav */}
                    <div className="flex overflow-x-auto hide-scrollbar gap-2 pb-2">
                        <NavBtn active={tab==='home'} onClick={() => setTab('home')} icon="🏠" text="หน้าหลัก" />
                        <NavBtn active={tab==='repair'} onClick={() => setTab('repair')} icon="🛠️" text="แจ้งซ่อม" />
                        <NavBtn active={tab==='myrepairs'} onClick={() => setTab('myrepairs')} icon="📋" text="ประวัติซ่อม" />
                    </div>

                    {/* Home / Announcements */}
                    {tab === 'home' && (
                        <div className="space-y-4">
                            <div className="glass-panel p-4 rounded-xl">
                                <h2 className="font-bold text-yellow-500 mb-2">📢 ประกาศจากตลาด</h2>
                                {announcements.length === 0 ? <p className="text-sm text-zinc-500">ไม่มีประกาศใหม่</p> : (
                                    <div className="space-y-3">
                                        {announcements.map(a => (
                                            <div key={a.id} className="bg-zinc-900 p-3 rounded-lg border-l-2 border-yellow-500">
                                                <div className="font-bold text-sm text-white">{a.title}</div>
                                                <div className="text-xs text-zinc-400 mb-1">{a.date}</div>
                                                <p className="text-sm text-zinc-300">{a.desc}</p>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Submit Repair */}
                    {tab === 'repair' && (
                        <form onSubmit={handleRepairSubmit} className="glass-panel p-4 rounded-xl space-y-4">
                            <h2 className="font-bold text-yellow-500">แจ้งปัญหา / แจ้งซ่อม</h2>
                            <div>
                                <label className="text-xs text-zinc-400 mb-1 block">รายละเอียดปัญหาที่คุณพบ</label>
                                <textarea required value={desc} onChange={e=>setDesc(e.target.value)} rows="4" className="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white" placeholder="เช่น หลังคารั่ว, ไฟไม่ติด, ท่อน้ำตัน..."></textarea>
                            </div>
                            <button type="submit" className="w-full bg-yellow-500 text-black font-bold py-3 rounded-lg text-sm shadow-[0_0_15px_rgba(234,179,8,0.3)]">ส่งเรื่องแจ้งซ่อม</button>
                        </form>
                    )}

                    {/* My Repairs History */}
                    {tab === 'myrepairs' && (
                        <div className="space-y-3">
                            <h2 className="font-bold text-yellow-500 px-2">ประวัติการแจ้งเรื่องของคุณ</h2>
                            {myRepairs.length === 0 ? <p className="text-sm text-zinc-500 text-center py-4 glass-panel rounded-xl">ยังไม่เคยแจ้งเรื่อง</p> : (
                                myRepairs.map(r => (
                                    <div key={r.id} className="glass-panel p-4 rounded-xl border border-zinc-700">
                                        <div className="flex justify-between items-start mb-2">
                                            <div className="text-xs text-zinc-400">{r.date}</div>
                                            <span className={`text-[10px] font-black px-2 py-0.5 rounded-full ${r.status === 'รอดำเนินการ' ? 'bg-red-500/20 text-red-400' : r.status === 'กำลังดำเนินการ' ? 'bg-yellow-500/20 text-yellow-400' : 'bg-green-500/20 text-green-400'}`}>
                                                {r.status}
                                            </span>
                                        </div>
                                        <p className="text-sm text-white bg-zinc-900 p-2 rounded">{r.desc}</p>
                                    </div>
                                ))
                            )}
                        </div>
                    )}
                </div>
            );
        };

        // UI Component: Navigation Button
        const NavBtn = ({ active, onClick, icon, text, badge }) => (
            <button onClick={onClick} className={`relative flex flex-col items-center justify-center min-w-[70px] py-2 px-3 rounded-xl transition-all ${active ? 'bg-yellow-500/20 text-yellow-400 border border-yellow-500/30' : 'bg-zinc-800 text-zinc-400 border border-transparent'}`}>
                <span className="text-xl mb-1">{icon}</span>
                <span className="text-[10px] font-bold">{text}</span>
                {badge > 0 && <span className="absolute top-1 right-1 bg-red-500 text-white text-[9px] font-black w-4 h-4 flex items-center justify-center rounded-full shadow">{badge}</span>}
            </button>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
