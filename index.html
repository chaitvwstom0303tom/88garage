<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>88 GARAGE - Tenant & Management System</title>
    
    <!-- Fonts: Noto Sans Thai -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans Thai"', 'sans-serif'],
                    },
                    colors: {
                        garage: {
                            50: '#f4f4f5',
                            100: '#e4e4e7',
                            800: '#27272a',
                            900: '#18181b',
                            950: '#09090b',
                        }
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM (Production CDN) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for React JSX in Browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        body {
            background-color: #09090b;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            min-height: 100vh;
            font-family: 'Noto Sans Thai', sans-serif;
        }

        #root {
            width: 100%;
            max-width: 480px;
            background-color: #f8fafc;
            height: 100vh;
            max-height: 920px;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        @media (max-width: 640px) {
            #root {
                max-width: 100%;
                height: 100vh;
                max-height: none;
                border-radius: 0;
            }
        }

        @media print {
            body { background-color: #ffffff !important; display: block !important; }
            #root { max-width: 100% !important; height: auto !important; box-shadow: none !important; border: none !important; }
            .no-print { display: none !important; }
            .printable-area { padding: 0 !important; margin: 0 !important; border: none !important; box-shadow: none !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- SVG Icons ---
        const IconHome = () => <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.75} stroke="currentColor" className="w-6 h-6"><path strokeLinecap="round" strokeLinejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" /></svg>;
        const IconPayment = () => <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.75} stroke="currentColor" className="w-6 h-6"><path strokeLinecap="round" strokeLinejoin="round" d="M2.25 8.25h19.5M2.25 9h19.5m-16.5 5.25h6m-6 2.25h3m-3.75 3h15a2.25 2.25 0 002.25-2.25V6.75A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25v10.5A2.25 2.25 0 004.5 19.5z" /></svg>;
        const IconRepair = () => <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.75} stroke="currentColor" className="w-6 h-6"><path strokeLinecap="round" strokeLinejoin="round" d="M11.42 15.17L17.25 21A2.652 2.652 0 0021 17.25l-5.877-5.877M11.42 15.17l2.492-3.053c.217-.267.153-.664-.131-.855l-2.73-1.82M11.42 15.17l-3.052 2.491c-.267.217-.664.153-.855-.131l-1.82-2.73m1.453-1.63l-4.57-4.57a2.652 2.652 0 013.75-3.75l4.57 4.57m-4.57 4.57l3.75 3.75M7.5 12h-.008v-.008H7.5V12z" /></svg>;
        const IconStall = () => <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.75} stroke="currentColor" className="w-6 h-6"><path strokeLinecap="round" strokeLinejoin="round" d="M13.5 21v-7.5a.75.75 0 01.75-.75h3a.75.75 0 01.75.75V21m-4.5 0H2.36m11.14 0H18m0 0h3.64m-1.39 0V9.349m-16.5 11.65V9.35m0 0a3.001 3.001 0 003.75-.615A2.999 2.999 0 009.75 9.75c.896 0 1.7-.393 2.25-1.016a2.999 2.999 0 002.25 1.016c.896 0 1.7-.393 2.25-1.016a3.001 3.001 0 003.75.614m-16.5 0a3.004 3.004 0 01-.621-4.72L4.318 3.44A1.5 1.5 0 015.378 3h13.243a1.5 1.5 0 011.06.44l1.19 1.189a3 3 0 01-.621 4.72m-13.5 8.65h3.75a.75.75 0 00.75-.75V13.5a.75.75 0 00-.75-.75H6.75a.75.75 0 00-.75.75v3.75c0 .415.336.75.75.75z" /></svg>;
        const IconBell = () => <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.75} stroke="currentColor" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" /></svg>;
        const IconChevronLeft = () => <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" /></svg>;
        const IconWater = () => <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.75} stroke="currentColor" className="w-6 h-6 text-sky-500"><path strokeLinecap="round" strokeLinejoin="round" d="M12 21a6.002 6.002 0 003.6-10.8c-.8-.6-1.6-1.4-2.4-2.4-.8-1-1.6-2.2-2.4-3.6C10 5.6 9.2 6.8 8.4 7.8c-.8 1-1.6 1.8-2.4 2.4A6.002 6.002 0 0012 21z" /></svg>;
        const IconElectric = () => <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.75} stroke="currentColor" className="w-6 h-6 text-amber-500"><path strokeLinecap="round" strokeLinejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z" /></svg>;
        const IconLogout = () => <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.75} stroke="currentColor" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" /></svg>;
        const IconCamera = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.75} stroke="currentColor" className={className || "w-6 h-6"}><path strokeLinecap="round" strokeLinejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z" /><path strokeLinecap="round" strokeLinejoin="round" d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zM18.75 10.5h.008v.008h-.008V10.5z" /></svg>;
        const IconMegaphone = () => <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.75} stroke="currentColor" className="w-6 h-6"><path strokeLinecap="round" strokeLinejoin="round" d="M19.114 5.636a9 9 0 010 12.728M16.463 8.288a5.25 5.25 0 010 7.424M6.75 8.25l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75z" /></svg>;
        const IconPrint = () => <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.75} stroke="currentColor" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M6.72 13.829c-.24.03-.48.062-.72.096m.72-.096a42.415 42.415 0 0110.56 0m-10.56 0L6.34 18m10.94-4.171c.24.03.48.062.72.096m-.72-.096L17.66 18m0 0l.229 2.523a1.125 1.125 0 01-1.12 1.227H7.231a1.125 1.125 0 01-1.12-1.227L6.34 18m11.32 0h-11.32m12.322-5.462A2.25 2.25 0 0018 10.5V6a2.25 2.25 0 00-2.25-2.25H8.25A2.25 2.25 0 006 6v4.5m12 0a2.25 2.25 0 01-2.25 2.25H8.25A2.25 2.25 0 016 10.5m12 0V18" /></svg>;
        const IconSheets = () => <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.75} stroke="currentColor" className="w-5 h-5 text-emerald-600"><path strokeLinecap="round" strokeLinejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" /></svg>;

        const GOOGLE_APPS_SCRIPT_CODE = `function doGet(e) {
  var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
  var data = sheet.getDataRange().getValues();
  if (data.length <= 1) {
    return ContentService.createTextOutput(JSON.stringify({ status: "success", data: [] }))
      .setMimeType(ContentService.MimeType.JSON);
  }
  var headers = data[0];
  var rows = data.slice(1);
  var result = rows.map(function(row) {
    var obj = {};
    headers.forEach(function(header, index) { obj[header] = row[index]; });
    return obj;
  });
  return ContentService.createTextOutput(JSON.stringify({ status: "success", data: result }))
    .setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  try {
    var contents = JSON.parse(e.postData.contents);
    var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
    if (sheet.getLastRow() === 0) {
      sheet.appendRow([
        "Timestamp", "StallNumber", "TenantName", "RentRate", 
        "WaterUnits", "WaterRate", "WaterAmount", 
        "ElectricUnits", "ElectricRate", "ElectricAmount", 
        "TrashFee", "TotalAmount", "Month", "Status"
      ]);
    }
    var items = Array.isArray(contents) ? contents : [contents];
    items.forEach(function(item) {
      sheet.appendRow([
        new Date(),
        item.stallNumber || "", item.tenantName || "", item.rentRate || 0,
        item.waterUnits || 0, item.waterRate || 0, item.waterAmount || 0,
        item.electricUnits || 0, item.electricRate || 0, item.electricAmount || 0,
        item.trashFee || 0, item.totalAmount || 0, item.month || "สิงหาคม 2026", item.status || "ค้างชำระ"
      ]);
    });
    return ContentService.createTextOutput(JSON.stringify({ status: "success", message: "บันทึกข้อมูลเรียบร้อย" }))
      .setMimeType(ContentService.MimeType.JSON);
  } catch(err) {
    return ContentService.createTextOutput(JSON.stringify({ status: "error", message: err.toString() }))
      .setMimeType(ContentService.MimeType.JSON);
  }
}`;

        const App = () => {
            const [toast, setToast] = useState({ show: false, message: '', type: 'info' });
            const showToast = (message, type = 'info') => {
                setToast({ show: true, message, type });
                setTimeout(() => setToast({ show: false, message: '', type: 'info' }), 3500);
            };

            const [authMode, setAuthMode] = useState('login');
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [isAdmin, setIsAdmin] = useState(false);
            const [currentUser, setCurrentUser] = useState(null);

            const [activeTab, setActiveTab] = useState('home'); 
            const [previousTab, setPreviousTab] = useState('');

            const [rates, setRates] = useState({
                rentRate: 3500,
                waterRate: 18,
                electricRate: 8,
                trashFee: 100
            });

            const [gasUrl, setGasUrl] = useState(localStorage.getItem('88_GARAGE_GAS_URL') || '');
            const [isSyncing, setIsSyncing] = useState(false);
            const [showGasScriptModal, setShowGasScriptModal] = useState(false);
            const [selectedInvoice, setSelectedInvoice] = useState(null);

            const [users, setUsers] = useState(() => {
                const saved = localStorage.getItem('88_GARAGE_USERS');
                return saved ? JSON.parse(saved) : [
                    { id: 1, name: "สมชาย ขายดี", password: "123", stallNumber: "A-12", rentOverride: 3500 }
                ];
            });
            
            const [meterData, setMeterData] = useState(() => {
                const saved = localStorage.getItem('88_GARAGE_METERS');
                return saved ? JSON.parse(saved) : {
                    "A-12": { water: 12, electric: 145, waterImg: null, electricImg: null, status: 'ค้างชำระ' }
                };
            });

            useEffect(() => {
                localStorage.setItem('88_GARAGE_USERS', JSON.stringify(users));
            }, [users]);

            useEffect(() => {
                localStorage.setItem('88_GARAGE_METERS', JSON.stringify(meterData));
            }, [meterData]);

            useEffect(() => {
                if (gasUrl) localStorage.setItem('88_GARAGE_GAS_URL', gasUrl);
            }, [gasUrl]);

            const calculateStallBill = (stallNo) => {
                const user = users.find(u => u.stallNumber === stallNo) || { name: 'ผู้เช่าทั่วไป', rentOverride: rates.rentRate };
                const meters = meterData[stallNo] || { water: 0, electric: 0, status: 'ค้างชำระ' };
                
                const rent = Number(user.rentOverride) || Number(rates.rentRate);
                const waterUnits = Number(meters.water) || 0;
                const waterAmount = waterUnits * Number(rates.waterRate);
                const electricUnits = Number(meters.electric) || 0;
                const electricAmount = electricUnits * Number(rates.electricRate);
                const trashFee = Number(rates.trashFee);
                const totalAmount = rent + waterAmount + electricAmount + trashFee;

                return {
                    stallNumber: stallNo,
                    tenantName: user.name,
                    rentRate: rent,
                    waterUnits,
                    waterRate: rates.waterRate,
                    waterAmount,
                    electricUnits,
                    electricRate: rates.electricRate,
                    electricAmount,
                    trashFee,
                    totalAmount,
                    status: meters.status || 'ค้างชำระ',
                    billingMonth: 'สิงหาคม 2026'
                };
            };

            const syncToGoogleSheets = async () => {
                if (!gasUrl) {
                    showToast("กรุณาใส่ Google Web App URL ในส่วนตั้งค่า Admin ก่อน", "error");
                    return;
                }
                setIsSyncing(true);
                try {
                    const payload = users.map(u => calculateStallBill(u.stallNumber));
                    await fetch(gasUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    showToast("ส่งข้อมูลไปยัง Google Sheets เรียบร้อยแล้ว", "success");
                } catch (err) {
                    showToast("เกิดข้อผิดพลาดในการเชื่อมต่อ Google Sheets", "error");
                } finally {
                    setIsSyncing(false);
                }
            };

            const handleLogin = (e) => {
                e.preventDefault();
                const name = e.target.name.value.trim();
                const password = e.target.password.value;
                const user = users.find(u => u.name === name && u.password === password);
                
                if (user) {
                    setCurrentUser(user);
                    setIsAuthenticated(true);
                    setIsAdmin(false);
                    setActiveTab('home');
                    showToast(`ยินดีต้อนรับคุณ ${user.name}`, "success");
                } else {
                    showToast("ชื่อผู้ใช้ หรือ รหัสผ่านไม่ถูกต้อง", "error");
                }
            };

            const handleRegister = (e) => {
                e.preventDefault();
                const name = e.target.name.value.trim();
                const password = e.target.password.value;
                const stallNumber = e.target.stallNumber.value.trim();
                
                if(users.find(u => u.name === name)) {
                    showToast("ชื่อนี้ถูกใช้งานแล้ว", "error");
                    return;
                }
                
                const newUser = { id: Date.now(), name, password, stallNumber, rentOverride: rates.rentRate };
                setUsers([...users, newUser]);
                
                if(!meterData[stallNumber]) {
                    setMeterData(prev => ({...prev, [stallNumber]: { water: 0, electric: 0, waterImg: null, electricImg: null, status: 'ค้างชำระ' }}));
                }

                showToast("ลงทะเบียนสำเร็จ กรุณาเข้าสู่ระบบ", "success");
                setAuthMode('login');
            };

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (e.target.password.value === "887799") {
                    setIsAuthenticated(true);
                    setIsAdmin(true);
                    setCurrentUser(null);
                    showToast("เข้าสู่ระบบ Admin สำเร็จ", "success");
                } else {
                    showToast("รหัสผ่าน Admin ไม่ถูกต้อง", "error");
                }
            };

            const handleLogout = () => {
                setIsAuthenticated(false);
                setIsAdmin(false);
                setCurrentUser(null);
                setAuthMode('login');
                showToast("ออกจากระบบแล้ว", "info");
            };

            const ViewAuth = () => (
                <div className="flex-1 bg-zinc-950 flex flex-col items-center justify-center p-6 h-full relative overflow-hidden">
                    <div className="w-full max-w-sm bg-white rounded-3xl p-8 shadow-2xl relative z-10 border border-zinc-200">
                        <div className="text-center mb-8">
                            <div className="w-20 h-20 bg-zinc-900 text-white rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl font-black shadow-lg">88</div>
                            <h1 className="text-2xl font-black text-zinc-900 tracking-tight">88 GARAGE</h1>
                            <p className="text-xs text-zinc-500 mt-1 font-medium">
                                {authMode === 'login' ? 'ระบบผู้เช่า (Tenant App)' : 
                                 authMode === 'register' ? 'ลงทะเบียนผู้เช่าใหม่' : 
                                 'ระบบจัดการผู้ดูแลระบบ (Admin)'}
                            </p>
                        </div>

                        {authMode === 'login' && (
                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-bold text-zinc-700 mb-1">ชื่อผู้ใช้งาน</label>
                                    <input name="name" type="text" required className="w-full border border-zinc-300 rounded-xl p-3 text-sm focus:outline-none focus:border-zinc-900 bg-zinc-50" placeholder="ระบุชื่อที่คุณตั้งไว้" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-zinc-700 mb-1">รหัสผ่าน</label>
                                    <input name="password" type="password" required className="w-full border border-zinc-300 rounded-xl p-3 text-sm focus:outline-none focus:border-zinc-900 bg-zinc-50" placeholder="••••••••" />
                                </div>
                                <button type="submit" className="w-full bg-zinc-900 text-white font-bold py-3.5 rounded-xl hover:bg-zinc-800 transition-colors shadow-md text-sm">เข้าสู่ระบบ</button>
                                
                                <div className="flex justify-between items-center text-xs pt-4 border-t border-zinc-100 mt-6">
                                    <button type="button" onClick={() => setAuthMode('register')} className="text-zinc-600 hover:text-zinc-900 font-bold">ลงทะเบียนใหม่</button>
                                    <button type="button" onClick={() => setAuthMode('admin_login')} className="text-zinc-400 hover:text-zinc-700">สำหรับ Admin</button>
                                </div>
                            </form>
                        )}

                        {authMode === 'register' && (
                            <form onSubmit={handleRegister} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-bold text-zinc-700 mb-1">ชื่อ-นามสกุล</label>
                                    <input name="name" type="text" required className="w-full border border-zinc-300 rounded-xl p-3 text-sm focus:outline-none focus:border-zinc-900 bg-zinc-50" placeholder="เช่น สมชาย ใจดี" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-zinc-700 mb-1">รหัสผ่าน</label>
                                    <input name="password" type="password" required className="w-full border border-zinc-300 rounded-xl p-3 text-sm focus:outline-none focus:border-zinc-900 bg-zinc-50" placeholder="ตั้งรหัสผ่านของคุณ" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-zinc-700 mb-1">หมายเลขล็อค/พื้นที่เช่า</label>

                <div className="h-full w-full relative flex flex-col font-sans">
                    <div className={`absolute top-4 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 no-print ${toast.show ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-4 pointer-events-none'}`}>
                        <div className={`px-4 py-2.5 rounded-full shadow-lg text-xs font-bold ${toast.type === 'error' ? 'bg-red-500 text-white' : toast.type === 'success' ? 'bg-emerald-600 text-white' : 'bg-zinc-800 text-white'}`}>
                            {toast.message}
                        </div>
                    </div>

                    {!isAuthenticated ? <ViewAuth /> : isAdmin ? <ViewAdmin /> : <ViewHome />}

                    {isAuthenticated && !isAdmin && (
                        <div className="absolute bottom-0 w-full bg-white border-t border-zinc-200 px-8 py-3 flex justify-around items-center z-10 rounded-t-3xl shadow-lg no-print">
                            <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center gap-1 ${activeTab === 'home' ? 'text-zinc-900 font-bold' : 'text-zinc-400'}`}>
                                <IconHome /><span className="text-[10px]">หน้าหลัก</span>
                            </button>
                            <button onClick={() => setActiveTab('stall')} className={`flex flex-col items-center gap-1 ${activeTab === 'stall' ? 'text-zinc-900 font-bold' : 'text-zinc-400'}`}>
                                <IconStall /><span className="text-[10px]">ล็อคเช่า</span>
                            </button>
                        </div>
                    )}

                    {selectedInvoice && <InvoiceModal bill={selectedInvoice} onClose={() => setSelectedInvoice(null)} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
