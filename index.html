<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>88 GARAGE - Tenant & Management System</title>
    
    <!-- Fonts: Noto Sans Thai -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans Thai"', 'sans-serif'],
                    },
                    colors: {
                        garage: {
                            50: '#f4f4f5',
                            100: '#e4e4e7',
                            800: '#27272a',
                            900: '#18181b',
                            950: '#09090b',
                        }
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM (Production CDN) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for React JSX in Browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        body {
            background-color: #09090b;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            min-height: 100vh;
            font-family: 'Noto Sans Thai', sans-serif;
        }

        #root {
            width: 100%;
            max-width: 480px;
            background-color: #f8fafc;
            height: 100vh;
            max-height: 920px;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        @media (max-width: 640px) {
            #root {
                max-width: 100%;
                height: 100vh;
                max-height: none;
                border-radius: 0;
            }
        }

        @media print {
            body { background-color: #ffffff !important; display: block !important; }
            #root { max-width: 100% !important; height: auto !important; box-shadow: none !important; border: none !important; }
            .no-print { display: none !important; }
            .printable-area { padding: 0 !important; margin: 0 !important; border: none !important; box-shadow: none !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const IconHome = () => <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.75} stroke="currentColor" className="w-6 h-6"><path strokeLinecap="round" strokeLinejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" /></svg>;
        const IconPayment = () => <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.75} stroke="currentColor" className="w-6 h-6"><path strokeLinecap="round" strokeLinejoin="round" d="M2.25 8.25h19.5M2.25 9h19.5m-16.5 5.25h6m-6 2.25h3m-3.75 3h15a2.25 2.25 0 002.25-2.25V6.75A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25v10.5A2.25 2.25 0 004.5 19.5z" /></svg>;
        const IconRepair = () => <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.75} stroke="currentColor" className="w-6 h-6"><path strokeLinecap="round" strokeLinejoin="round" d="M11.42 15.17L17.25 21A2.652 2.652 0 0021 17.25l-5.877-5.877M11.42 15.17l2.492-3.053c.217-.267.153-.664-.131-.855l-2.73-1.82M11.42 15.17l-3.052 2.491c-.267.217-.664.153-.855-.131l-1.82-2.73m1.453-1.63l-4.57-4.57a2.652 2.652 0 013.75-3.75l4.57 4.57m-4.57 4.57l3.75 3.75M7.5 12h-.008v-.008H7.5V12z" /></svg>;
        const IconStall = () => <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.75} stroke="currentColor" className="w-6 h-6"><path strokeLinecap="round" strokeLinejoin="round" d="M13.5 21v-7.5a.75.75 0 01.75-.75h3a.75.75 0 01.75.75V21m-4.5 0H2.36m11.14 0H18m0 0h3.64m-1.39 0V9.349m-16.5 11.65V9.35m0 0a3.001 3.001 0 003.75-.615A2.999 2.999 0 009.75 9.75c.896 0 1.7-.393 2.25-1.016a2.999 2.999 0 002.25 1.016c.896 0 1.7-.393 2.25-1.016a3.001 3.001 0 003.75.614m-16.5 0a3.004 3.004 0 01-.621-4.72L4.318 3.44A1.5 1.5 0 015.378 3h13.243a1.5 1.5 0 011.06.44l1.19 1.189a3 3 0 01-.621 4.72m-13.5 8.65h3.75a.75.75 0 00.75-.75V13.5a.75.75 0 00-.75-.75H6.75a.75.75 0 00-.75.75v3.75c0 .415.336.75.75.75z" /></svg>;
        const IconMegaphone = () => <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.75} stroke="currentColor" className="w-6 h-6"><path strokeLinecap="round" strokeLinejoin="round" d="M19.114 5.636a9 9 0 010 12.728M16.463 8.288a5.25 5.25 0 010 7.424M6.75 8.25l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75z" /></svg>;
        const IconPrint = () => <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.75} stroke="currentColor" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M6.72 13.829c-.24.03-.48.062-.72.096m.72-.096a42.415 42.415 0 0110.56 0m-10.56 0L6.34 18m10.94-4.171c.24.03.48.062.72.096m-.72-.096L17.66 18m0 0l.229 2.523a1.125 1.125 0 01-1.12 1.227H7.231a1.125 1.125 0 01-1.12-1.227L6.34 18m11.32 0h-11.32m12.322-5.462A2.25 2.25 0 0018 10.5V6a2.25 2.25 0 00-2.25-2.25H8.25A2.25 2.25 0 006 6v4.5m12 0a2.25 2.25 0 01-2.25 2.25H8.25A2.25 2.25 0 016 10.5m12 0V18" /></svg>;
        const IconSheets = () => <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.75} stroke="currentColor" className="w-5 h-5 text-emerald-600"><path strokeLinecap="round" strokeLinejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" /></svg>;
        const IconRefresh = () => <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.75} stroke="currentColor" className="w-4 h-4"><path strokeLinecap="round" strokeLinejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" /></svg>;
        const IconReceipt = () => <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.75} stroke="currentColor" className="w-6 h-6"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>;
        const IconWater = () => <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.75} stroke="currentColor" className="w-6 h-6 text-sky-500"><path strokeLinecap="round" strokeLinejoin="round" d="M12 21a6.002 6.002 0 003.6-10.8c-.8-.6-1.6-1.4-2.4-2.4-.8-1-1.6-2.2-2.4-3.6C10 5.6 9.2 6.8 8.4 7.8c-.8 1-1.6 1.8-2.4 2.4A6.002 6.002 0 0012 21z" /></svg>;
        const IconElectric = () => <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.75} stroke="currentColor" className="w-6 h-6 text-amber-500"><path strokeLinecap="round" strokeLinejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z" /></svg>;
        const IconLogout = () => <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.75} stroke="currentColor" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" /></svg>;

        const GOOGLE_APPS_SCRIPT_CODE = `function doGet(e) { ... (ดูโค้ดเต็มในหน้าตั้งค่า) ... }`;

        const ViewAuth = ({ ctx }) => {
            const { authMode, setAuthMode, handleLogin, handleRegister, handleAdminLogin } = ctx;
            
            return (
                <div className="flex-1 bg-zinc-950 flex flex-col items-center justify-center p-6 h-full relative overflow-hidden">
                    <div className="w-full max-w-sm bg-white rounded-3xl p-8 shadow-2xl relative z-10 border border-zinc-200">
                        <div className="text-center mb-8">
                            <div className="w-20 h-20 bg-zinc-900 text-white rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl font-black shadow-lg">88</div>
                            <h1 className="text-2xl font-black text-zinc-900 tracking-tight">88 GARAGE</h1>
                            <p className="text-xs text-zinc-500 mt-1 font-medium">
                                {authMode === 'login' ? 'ระบบผู้เช่า (Tenant App)' : 
                                 authMode === 'register' ? 'ลงทะเบียนผู้เช่า/ร้านค้าใหม่' : 
                                 'ระบบจัดการผู้ดูแลระบบ (Admin)'}
                            </p>
                        </div>

                        {authMode === 'login' && (
                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-bold text-zinc-700 mb-1">ชื่อร้าน / หมายเลขล็อค</label>
                                    <input name="name" type="text" required className="w-full border border-zinc-300 rounded-xl p-3 text-sm focus:outline-none focus:border-zinc-900 bg-zinc-50" placeholder="เช่น ร้านกาแฟ A-12 หรือ A-12" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-zinc-700 mb-1">รหัสผ่าน</label>
                                    <input name="password" type="password" required className="w-full border border-zinc-300 rounded-xl p-3 text-sm focus:outline-none focus:border-zinc-900 bg-zinc-50" placeholder="••••••••" />
                                </div>
                                <button type="submit" className="w-full bg-zinc-900 text-white font-bold py-3.5 rounded-xl hover:bg-zinc-800 transition-colors shadow-md text-sm">เข้าสู่ระบบ</button>
                                
                                <div className="flex justify-between items-center text-xs pt-4 border-t border-zinc-100 mt-6">
                                    <button type="button" onClick={() => setAuthMode('register')} className="text-zinc-600 hover:text-zinc-900 font-bold">ลงทะเบียนใหม่</button>
                                    <button type="button" onClick={() => setAuthMode('admin_login')} className="text-zinc-400 hover:text-zinc-700">สำหรับ Admin</button>
                                </div>
                            </form>
                        )}

                        {authMode === 'register' && (
                            <form onSubmit={handleRegister} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-bold text-zinc-700 mb-1">ชื่อร้าน / ผู้เช่า</label>
                                    <input name="name" type="text" required className="w-full border border-zinc-300 rounded-xl p-3 text-sm focus:outline-none focus:border-zinc-900 bg-zinc-50" placeholder="เช่น ร้านกาแฟ อร่อยดี" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-zinc-700 mb-1">รหัสผ่าน</label>
                                    <input name="password" type="password" required className="w-full border border-zinc-300 rounded-xl p-3 text-sm focus:outline-none focus:border-zinc-900 bg-zinc-50" placeholder="ตั้งรหัสผ่านของคุณ" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-zinc-700 mb-1">หมายเลขล็อค/พื้นที่เช่า</label>
                                    <input name="stallNumber" type="text" required className="w-full border border-zinc-300 rounded-xl p-3 text-sm focus:outline-none focus:border-zinc-900 bg-zinc-50" placeholder="เช่น A-12, B-01" />
                                </div>
                                <button type="submit" className="w-full bg-zinc-900 text-white font-bold py-3.5 rounded-xl hover:bg-zinc-800 transition-colors shadow-md text-sm">ยืนยันลงทะเบียน</button>
                                
                                <div className="text-center text-xs pt-4 border-t border-zinc-100 mt-6">
                                    <button type="button" onClick={() => setAuthMode('login')} className="text-zinc-600 hover:text-zinc-900 font-bold">กลับไปหน้าเข้าสู่ระบบ</button>
                                </div>
                            </form>
                        )}

                        {authMode === 'admin_login' && (
                            <form onSubmit={handleAdminLogin} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-bold text-zinc-700 mb-1">รหัสผ่านผู้ดูแลระบบ (รหัสเริ่มต้น: 887799)</label>
                                    <input name="password" type="password" required className="w-full border border-zinc-300 rounded-xl p-3 text-sm focus:outline-none focus:border-zinc-900 bg-zinc-50 text-center tracking-widest text-lg font-bold" placeholder="••••••" />
                                </div>
                                <button type="submit" className="w-full bg-zinc-900 text-white font-bold py-3.5 rounded-xl hover:bg-zinc-800 transition-colors shadow-md text-sm">เข้าสู่ระบบ Admin</button>
                                
                                <div className="text-center text-xs pt-4 border-t border-zinc-100 mt-6">
                                    <button type="button" onClick={() => setAuthMode('login')} className="text-zinc-600 hover:text-zinc-900 font-bold">กลับไปหน้าผู้เช่า</button>
                                </div>
                            </form>
                        )}
                    </div>
                </div>
            );
        };

        const ViewAdmin = ({ ctx }) => {
            const {
                users, setUsers, meterData, setMeterData, gasUrl, setGasUrl, rates, setRates,
                calculateStallBill, announcements, setAnnouncements, repairs, setRepairs,
                receipts, setReceipts, handleLogout, isLoadingSheet, fetchFromGoogleSheets,
                isSyncing, syncToGoogleSheets, showToast, setShowGasScriptModal, setSelectedInvoice, setSelectedReceipt
            } = ctx;

            // Admin Local States
            const [adminTab, setAdminTab] = useState('stores');
            const [selectedStall, setSelectedStall] = useState('');
            const [water, setWater] = useState('');
            const [electric, setElectric] = useState('');

            const [newStoreName, setNewStoreName] = useState('');
            const [newStoreStall, setNewStoreStall] = useState('');
            const [newStorePassword, setNewStorePassword] = useState('123');
            const [newStoreRent, setNewStoreRent] = useState(rates.rentRate);
            const [editingStoreId, setEditingStoreId] = useState(null);

            const [annTitle, setAnnTitle] = useState('');
            const [annContent, setAnnContent] = useState('');
            const [annPriority, setAnnPriority] = useState('normal');

            const [editingRepair, setEditingRepair] = useState(null);
            const [updateStatus, setUpdateStatus] = useState('รอดำเนินการ');
            const [adminNoteInput, setAdminNoteInput] = useState('');
            const [adminPhotoInput, setAdminPhotoInput] = useState('');

            const handleStallSelect = (e) => {
                const stall = e.target.value;
                setSelectedStall(stall);
                if(stall && meterData[stall]) {
                    setWater(meterData[stall].water || '');
                    setElectric(meterData[stall].electric || '');
                } else {
                    setWater(''); setElectric('');
                }
            };

            const handleSaveMeter = () => {
                if(!selectedStall) return showToast('กรุณาเลือกล็อคเพื่อบันทึก', 'error');
                const updatedMeters = {
                    ...meterData,
                    [selectedStall]: { ...meterData[selectedStall], water: Number(water), electric: Number(electric) }
                };
                setMeterData(updatedMeters);
                const stallBill = calculateStallBill(selectedStall, updatedMeters); // pass explicit meter data to ensure fresh calculation

                if (gasUrl) {
                    syncToGoogleSheets([stallBill], 'save_bills');
                } else {
                    showToast(`บันทึกมิเตอร์ล็อค ${selectedStall} แล้ว`, 'info');
                }
            };

            const handleSaveStore = (e) => {
                e.preventDefault();
                if(!newStoreName || !newStoreStall) return showToast("กรุณากรอกชื่อร้านและหมายเลขล็อค", "error");

                let updatedList;
                if (editingStoreId) {
                    updatedList = users.map(u => u.id === editingStoreId ? {
                        ...u, name: newStoreName, stallNumber: newStoreStall, password: newStorePassword, rentOverride: Number(newStoreRent)
                    } : u);
                } else {
                    updatedList = [...users, { id: Date.now(), name: newStoreName, stallNumber: newStoreStall, password: newStorePassword, rentOverride: Number(newStoreRent) }];
                }

                setUsers(updatedList);
                if(!meterData[newStoreStall]) {
                    setMeterData(prev => ({...prev, [newStoreStall]: { water: 0, electric: 0, status: 'ค้างชำระ' }}));
                }
                if (gasUrl) syncToGoogleSheets(updatedList, 'save_stores');

                showToast(editingStoreId ? "แก้ไขข้อมูลร้านเรียบร้อยแล้ว" : "เพิ่มร้านค้าใหม่เรียบร้อยแล้ว", "success");
                setNewStoreName(''); setNewStoreStall(''); setNewStorePassword('123'); setNewStoreRent(rates.rentRate); setEditingStoreId(null);
            };

            const startEditStore = (u) => {
                setEditingStoreId(u.id); setNewStoreName(u.name); setNewStoreStall(u.stallNumber);
                setNewStorePassword(u.password || '123'); setNewStoreRent(u.rentOverride || rates.rentRate);
            };

            const handleAddAnnouncement = (e) => {
                e.preventDefault();
                if (!annTitle || !annContent) return showToast('กรุณากรอกหัวข้อและรายละเอียดประกาศ', 'error');
                const newAnn = {
                    id: Date.now(), title: annTitle, content: annContent, priority: annPriority,
                    date: new Date().toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' })
                };
                setAnnouncements([newAnn, ...announcements]);
                setAnnTitle(''); setAnnContent(''); setAnnPriority('normal');
                showToast('เพิ่มประกาศใหม่เรียบร้อยแล้ว (อัปเดตไปผู้เช่าทันที)', 'success');
            };

            const handleSaveRepairStatus = (e) => {
                e.preventDefault();
                if (!editingRepair) return;
                const updated = repairs.map(r => r.id === editingRepair.id ? {
                    ...r, status: updateStatus, adminNote: adminNoteInput, adminPhoto: adminPhotoInput || r.adminPhoto
                } : r);
                setRepairs(updated);
                setEditingRepair(null); setAdminNoteInput(''); setAdminPhotoInput('');
                showToast('อัปเดตสถานะการแจ้งซ่อมเรียบร้อยแล้ว', 'success');
            };

            const handleApproveReceipt = (receiptId) => {
                const updated = receipts.map(rc => rc.id === receiptId ? {
                    ...rc, status: 'อนุมัติแล้ว/ออกใบเสร็จแล้ว', receiptNo: `REC-${new Date().getFullYear()}${(new Date().getMonth()+1).toString().padStart(2,'0')}-${Math.floor(100+Math.random()*900)}`
                } : rc);
                setReceipts(updated);

                const targetRc = receipts.find(r => r.id === receiptId);
                if (targetRc && meterData[targetRc.stallNumber]) {
                    setMeterData({...meterData, [targetRc.stallNumber]: { ...meterData[targetRc.stallNumber], status: 'ชำระแล้ว' }});
                }
                showToast('อนุมัติและออกใบเสร็จเรียบร้อยแล้ว', 'success');
            };

            const handleFileRead = (e, setter) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => setter(reader.result);
                    reader.readAsDataURL(file);
                }
            };

            return (
                <div className="flex-1 overflow-y-auto bg-zinc-50 flex flex-col h-full no-print pb-20">
                    <div className="bg-zinc-900 px-4 py-4 flex items-center justify-between shadow-md sticky top-0 z-10 text-white">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 bg-white text-zinc-900 rounded-xl flex items-center justify-center font-black text-lg">88</div>
                            <div>
                                <h1 className="text-base font-bold leading-tight">Admin Management</h1>
                                <p className="text-[10px] text-zinc-400">88 GARAGE Backend</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            {gasUrl && (

                            </div>

                    </div>
                </div>
            );
        };

        const ViewHome = ({ ctx }) => {

                currentUser, handleLogout, announcements, repairs, setRepairs,

                    timestamp: new Date().toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' }) + ' ' + new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })
                };

            };

            const handleTenantRequestReceipt = (e) => {
                e.preventDefault();
                if (receipts.find(r => r.stallNumber === currentUser.stallNumber && r.status === 'รออนุมัติ')) {
                    return showToast('คุณได้ส่งคำขอไปแล้ว กรุณารอ Admin ตรวจสอบ', 'info');
                }
                const newRequest = {
                    id: Date.now(), stallNumber: currentUser.stallNumber, tenantName: currentUser.name,
                    billingMonth: bill.billingMonth, totalAmount: bill.totalAmount,
                    requestDate: new Date().toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' }),
                    status: 'รออนุมัติ', slipPhoto: slipPhoto, receiptNo: null

            const myReceipts = useMemo(() => receipts.filter(r => r.stallNumber === currentUser?.stallNumber), [receipts, currentUser]);

            if (!currentUser) return null;

            return (
                <div className="flex-1 overflow-y-auto pb-24 bg-zinc-50 no-print">
                    <div className="bg-white px-4 py-3 flex items-center justify-between shadow-sm sticky top-0 z-10">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 bg-zinc-900 rounded-xl flex items-center justify-center text-white font-black">88</div>
                            <div>
                                <h1 className="text-base font-bold text-zinc-900 leading-tight">88 GARAGE</h1>
                                <p className="text-[10px] text-zinc-500 font-medium">Tenant App</p>
                            </div>
                        </div>
                        <button onClick={handleLogout} className="p-2 rounded-xl bg-zinc-100 text-zinc-600"><IconLogout /></button>
                    </div>

                    {activeTab === 'home' && (
                        <div className="p-4 space-y-5">
                            <div>
                                <p className="text-xs text-zinc-500 font-medium">ยินดีต้อนรับ,</p>
                                <p className="text-lg font-bold text-zinc-900">{currentUser.name}</p>
                                <p className="text-xs text-zinc-500 font-mono">หมายเลขล็อค: {currentUser.stallNumber}</p>
                            </div>

                            {announcements.length > 0 && (
                                <div onClick={() => setActiveTab('announcements')} className="bg-amber-50 border border-amber-200 rounded-2xl p-3.5 flex items-start gap-3 cursor-pointer shadow-sm">
                                    <div className="p-2 bg-amber-500 text-white rounded-xl mt-0.5"><IconMegaphone /></div>
                                    <div className="flex-1 min-w-0">
                                        <div className="flex justify-between"><span className="text-[10px] font-bold text-amber-800">📢 ประกาศใหม่</span><span className="text-[9px] text-amber-600">{announcements[0].date}</span></div>
                                        <h3 className="text-xs font-bold text-zinc-900 truncate">{announcements[0].title}</h3>
                                        <p className="text-[11px] text-zinc-600 truncate">{announcements[0].content}</p>
                                    </div>
                                </div>
                            )}

                            <div className="bg-zinc-900 rounded-3xl p-6 text-white shadow-xl relative overflow-hidden">
                                <div className="flex justify-between items-start mb-2">
                                    <span className="text-zinc-300 text-xs font-semibold">ยอดรวมประจำเดือน</span>
                                    <button onClick={() => setSelectedInvoice(bill)} className="text-xs bg-white/10 text-white px-3 py-1 rounded-full flex items-center gap-1"><IconPrint /> ดูใบแจ้งหนี้</button>
                                </div>
                                <div className="text-4xl font-black mb-4"><span className="text-2xl mr-1 font-medium">฿</span>{bill.totalAmount.toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
                                <div className="grid grid-cols-2 gap-2 text-xs text-zinc-300 border-t border-zinc-800 pt-3 mb-2 font-medium">
                                    <div>น้ำ: <span className="font-bold text-white">{bill.waterUnits} u (฿{bill.waterAmount.toLocaleString()})</span></div>
                                    <div>ไฟ: <span className="font-bold text-white">{bill.electricUnits} u (฿{bill.electricAmount.toLocaleString()})</span></div>
                                    <div>ค่าเช่า: <span className="font-bold text-white">฿{bill.rentRate.toLocaleString()}</span></div>
                                    <div>ส่วนกลาง: <span className="font-bold text-white">฿{bill.trashFee.toLocaleString()}</span></div>
                                </div>
                            </div>

                            <div>
                                <h2 className="text-xs font-bold text-zinc-800 mb-3">ทางลัดบริการ</h2>
                                <div className="grid grid-cols-3 gap-3">
                                    <div onClick={() => setActiveTab('announcements')} className="bg-white rounded-2xl p-3.5 flex flex-col items-center shadow-sm border border-zinc-100 cursor-pointer"><div className="text-amber-500 mb-1"><IconMegaphone /></div><span className="text-[11px] font-bold text-zinc-800">ประกาศ</span></div>
                                    <div onClick={() => setActiveTab('repairs')} className="bg-white rounded-2xl p-3.5 flex flex-col items-center shadow-sm border border-zinc-100 cursor-pointer"><div className="text-sky-600 mb-1"><IconRepair /></div><span className="text-[11px] font-bold text-zinc-800">แจ้งซ่อม</span></div>
                                    <div onClick={() => setActiveTab('receipts')} className="bg-white rounded-2xl p-3.5 flex flex-col items-center shadow-sm border border-zinc-100 cursor-pointer"><div className="text-emerald-600 mb-1"><IconReceipt /></div><span className="text-[11px] font-bold text-zinc-800">ขอใบเสร็จ</span></div>
                                </div>
                            </div>
                        </div>
                    )}

                    {activeTab === 'announcements' && (
                        <div className="p-4 space-y-4">
                            <div className="flex items-center gap-2 border-b pb-2"><div className="p-2 bg-zinc-900 text-white rounded-xl"><IconMegaphone /></div><div><h2 className="text-sm font-bold text-zinc-900">ประกาศตลาด</h2><p className="text-[10px] text-zinc-500">อัปเดตข่าวสารสำคัญ</p></div></div>
                            <div className="space-y-3">
                                {announcements.map(ann => (
                                    <div key={ann.id} className="bg-white rounded-2xl p-4 border border-zinc-200 shadow-sm space-y-2">
                                        <div className="flex justify-between items-start">
                                            <div className="flex items-center gap-2">
                                                {ann.priority === 'urgent' ? <span className="bg-red-500 text-white text-[9px] font-black px-2 py-0.5 rounded-full">ด่วน</span> : <span className="bg-zinc-100 text-zinc-700 text-[9px] font-bold px-2 py-0.5 rounded-full">ทั่วไป</span>}
                                                <h3 className="font-bold text-xs text-zinc-900">{ann.title}</h3>
                                            </div>
                                            <span className="text-[10px] text-zinc-400 font-mono">{ann.date}</span>
                                        </div>
                                        <p className="text-xs text-zinc-600 leading-relaxed font-medium bg-zinc-50 p-2.5 rounded-xl">{ann.content}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {activeTab === 'repairs' && (
                        <div className="p-4 space-y-5">
                            <div className="bg-white rounded-2xl p-4 shadow-sm border border-zinc-200 space-y-3">
                                <h2 className="text-sm font-bold text-zinc-800 border-b pb-2 flex items-center gap-2"><IconRepair /> แจ้งซ่อม / แจ้งปัญหา</h2>
                                <form onSubmit={handleTenantRepairSubmit} className="space-y-3">
                                    <select value={repCategory} onChange={e => setRepCategory(e.target.value)} className="w-full border rounded-xl p-2.5 text-xs bg-zinc-50 font-medium">
                                        <option value="ระบบไฟฟ้า">ระบบไฟฟ้า</option><option value="ระบบน้ำ/ประปา">ระบบน้ำ / ประปา</option><option value="โครงสร้าง/สถานที่">โครงสร้าง / อาคาร</option><option value="ความสะอาด/ขยะ">ความสะอาด / ขยะ</option><option value="อื่นๆ">อื่นๆ</option>
                                    </select>
                                    <textarea rows={3} value={repDesc} onChange={e => setRepDesc(e.target.value)} placeholder="อธิบายปัญหา..." className="w-full border rounded-xl p-2.5 text-xs bg-zinc-50 font-medium" />
                                    <div>
                                        <label className="block text-xs font-bold text-zinc-700 mb-1">แนบรูปถ่าย (ถ้ามี)</label>
                                        <input type="file" accept="image/*" onChange={(e) => handleFileRead(e, setRepPhoto)} className="w-full border rounded-xl p-2 text-xs bg-zinc-50" />
                                        {repPhoto && <img src={repPhoto} className="mt-2 h-24 w-full object-cover rounded-xl border" />}
                                    </div>
                                    <button type="submit" className="w-full bg-zinc-900 text-white font-bold py-3 rounded-xl text-xs shadow-md">ส่งรายการแจ้งซ่อมไปยัง Admin</button>
                                </form>
                            </div>
                            <div className="space-y-3">
                                <h3 className="text-xs font-bold text-zinc-800">ประวัติการแจ้งของฉัน ({myRepairs.length})</h3>
                                {myRepairs.length === 0 ? <p className="text-xs text-zinc-400 text-center py-6">ไม่มีรายการแจ้งซ่อม</p> : myRepairs.map(r => (
                                    <div key={r.id} className="bg-white rounded-2xl p-4 border shadow-sm space-y-3">
                                        <div className="flex justify-between items-start border-b pb-2">
                                            <div><span className="font-bold text-xs text-zinc-900">{r.category}</span><p className="text-[10px] text-zinc-400">{r.timestamp}</p></div>
                                            <span className={`text-[11px] px-2.5 py-1 rounded-full font-bold ${r.status === 'แก้ไขแล้ว' ? 'bg-emerald-100 text-emerald-800' : r.status === 'กำลังดำเนินการ' ? 'bg-sky-100 text-sky-800' : 'bg-amber-100 text-amber-800'}`}>{r.status}</span>
                                        </div>
                                        <p className="text-xs text-zinc-700 bg-zinc-50 p-2.5 rounded-xl">{r.description}</p>
                                        {r.tenantPhoto && <div><p className="text-[10px] text-zinc-400 mb-1">รูปที่แนบ:</p><img src={r.tenantPhoto} className="w-full h-32 object-cover rounded-xl border" /></div>}
                                        {r.adminNote && <div className="bg-sky-50 border p-3 rounded-xl text-xs"><p className="font-bold text-sky-900">💬 อัปเดตจาก Admin:</p><p className="text-sky-800">{r.adminNote}</p></div>}
                                        {r.adminPhoto && <div className="bg-emerald-50 border p-3 rounded-xl text-xs"><p className="font-bold text-emerald-900">✅ รูปยืนยันการแก้ไข:</p><img src={r.adminPhoto} className="w-full h-36 object-cover rounded-xl border mt-1" /></div>}
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {activeTab === 'receipts' && (
                        <div className="p-4 space-y-5">
                            <div className="bg-white rounded-2xl p-4 shadow-sm border border-zinc-200 space-y-3">
                                <h2 className="text-sm font-bold text-zinc-800 border-b pb-2 flex items-center gap-2"><IconReceipt /> ยื่นขอใบเสร็จรับเงิน</h2>
                                <div className="bg-zinc-50 p-3 rounded-xl text-xs space-y-1 border"><div className="flex justify-between font-bold"><span>รอบบิล:</span> <span>{bill.billingMonth}</span></div><div className="flex justify-between font-bold"><span>ยอดชำระ:</span> <span className="text-emerald-700">฿{bill.totalAmount.toLocaleString()}</span></div></div>
                                <form onSubmit={handleTenantRequestReceipt} className="space-y-3">
                                    <div>
                                        <label className="block text-xs font-bold text-zinc-700 mb-1">แนบสลิปโอนเงิน (ถ้ามี)</label>
                                        <input type="file" accept="image/*" onChange={(e) => handleFileRead(e, setSlipPhoto)} className="w-full border rounded-xl p-2 text-xs bg-zinc-50" />
                                        {slipPhoto && <img src={slipPhoto} className="mt-2 h-36 w-full object-contain rounded-xl border p-1" />}
                                    </div>
                                    <button type="submit" className="w-full bg-zinc-900 text-white font-bold py-3 rounded-xl text-xs shadow-md">ส่งคำขอใบเสร็จ</button>
                                </form>
                            </div>
                            <div className="space-y-3">
                                <h3 className="text-xs font-bold text-zinc-800">รายการของฉัน ({myReceipts.length})</h3>
                                {myReceipts.map(rc => (
                                    <div key={rc.id} className="bg-white rounded-2xl p-4 border shadow-sm space-y-2">
                                        <div className="flex justify-between items-start border-b pb-2">
                                            <div><span className="font-bold text-xs text-zinc-900">{rc.billingMonth}</span><p className="text-[10px] text-zinc-400">วันที่ขอ: {rc.requestDate}</p></div>
                                            <span className={`text-[10px] px-2.5 py-1 rounded-full font-bold ${rc.status.includes('อนุมัติ') ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>{rc.status}</span>
                                        </div>
                                        <div className="flex justify-between items-center text-xs pt-1">
                                            <span className="font-bold">ยอดเงิน: ฿{(rc.totalAmount||0).toLocaleString()}</span>
                                            {rc.status.includes('อนุมัติ') ? <button onClick={() => setSelectedReceipt(rc)} className="bg-emerald-600 text-white text-xs font-bold px-3 py-1.5 rounded-xl flex items-center gap-1"><IconPrint /> ใบเสร็จ</button> : <span className="text-[11px] text-amber-600 font-bold">รออนุมัติ...</span>}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [toast, setToast] = useState({ show: false, message: '', type: 'info' });
            const showToast = (message, type = 'info') => {
                setToast({ show: true, message, type });
                setTimeout(() => setToast({ show: false, message: '', type: 'info' }), 3500);
            };

            const [authMode, setAuthMode] = useState('login');
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [isAdmin, setIsAdmin] = useState(false);
            const [currentUser, setCurrentUser] = useState(null);
            const [activeTab, setActiveTab] = useState('home'); 

            const [rates, setRates] = useState({ rentRate: 3500, waterRate: 18, electricRate: 8, trashFee: 100 });
            const [gasUrl, setGasUrl] = useState(localStorage.getItem('88_GARAGE_GAS_URL') || '');
            const [isSyncing, setIsSyncing] = useState(false);
            const [isLoadingSheet, setIsLoadingSheet] = useState(false);
            const [showGasScriptModal, setShowGasScriptModal] = useState(false);
            const [selectedInvoice, setSelectedInvoice] = useState(null);
            const [selectedReceipt, setSelectedReceipt] = useState(null);

            const [announcements, setAnnouncements] = useState(() => JSON.parse(localStorage.getItem('88_GARAGE_ANNOUNCEMENTS') || '[]'));
            const [repairs, setRepairs] = useState(() => JSON.parse(localStorage.getItem('88_GARAGE_REPAIRS') || '[]'));
            const [receipts, setReceipts] = useState(() => JSON.parse(localStorage.getItem('88_GARAGE_RECEIPTS') || '[]'));
            const [users, setUsers] = useState(() => JSON.parse(localStorage.getItem('88_GARAGE_USERS') || '[]'));
            const [meterData, setMeterData] = useState(() => JSON.parse(localStorage.getItem('88_GARAGE_METERS') || '{}'));

            useEffect(() => { localStorage.setItem('88_GARAGE_USERS', JSON.stringify(users)); }, [users]);
            useEffect(() => { localStorage.setItem('88_GARAGE_METERS', JSON.stringify(meterData)); }, [meterData]);
            useEffect(() => { localStorage.setItem('88_GARAGE_ANNOUNCEMENTS', JSON.stringify(announcements)); }, [announcements]);
            useEffect(() => { localStorage.setItem('88_GARAGE_REPAIRS', JSON.stringify(repairs)); }, [repairs]);
            useEffect(() => { localStorage.setItem('88_GARAGE_RECEIPTS', JSON.stringify(receipts)); }, [receipts]);
            useEffect(() => { if (gasUrl) localStorage.setItem('88_GARAGE_GAS_URL', gasUrl); }, [gasUrl]);

            // Real-time multi-tab synchronization
            useEffect(() => {
                const handleStorageChange = (e) => {
                    if (e.key === '88_GARAGE_REPAIRS' && e.newValue) setRepairs(JSON.parse(e.newValue));
                    if (e.key === '88_GARAGE_ANNOUNCEMENTS' && e.newValue) setAnnouncements(JSON.parse(e.newValue));
                    if (e.key === '88_GARAGE_RECEIPTS' && e.newValue) setReceipts(JSON.parse(e.newValue));
                    if (e.key === '88_GARAGE_USERS' && e.newValue) setUsers(JSON.parse(e.newValue));
                    if (e.key === '88_GARAGE_METERS' && e.newValue) setMeterData(JSON.parse(e.newValue));
                };
                window.addEventListener('storage', handleStorageChange);
                return () => window.removeEventListener('storage', handleStorageChange);
            }, []);

            const fetchFromGoogleSheets = async () => {
                if (!gasUrl) return;
                setIsLoadingSheet(true);
                try {
                    const res = await fetch(gasUrl);
                    const json = await res.json();
                    if (json.status === 'success') {
                        if (json.data && json.data.length > 0) {
                            const newMeters = { ...meterData };
                            json.data.forEach(row => {
                                const stall = row.StallNumber || row.stallNumber;
                                if (stall) newMeters[stall] = { ...(newMeters[stall] || {}), water: Number(row["หน่วยค่าน้ำ"] || row.WaterUnits || 0), electric: Number(row["หน่วยค่าไฟ"] || row.ElectricUnits || 0), status: row.Status || row.status || 'ค้างชำระ' };
                            });
                            setMeterData(newMeters);
                        }
                        if (json.stores && json.stores.length > 0) {
                            const fetchedUsers = json.stores.map((s, idx) => ({ id: Date.now() + idx, name: s["ชื่อร้าน"] || s.tenantName || `ร้าน ${s.StallNumber}`, password: String(s["รหัสผ่าน"] || s.password || "123"), stallNumber: String(s.StallNumber || s.stallNumber || `A-${idx+1}`), rentOverride: Number(s["ค่าเช่าร้าน"] || s.rentOverride) || rates.rentRate }));
                            setUsers(fetchedUsers);
                        }
                        showToast("ดึงข้อมูลล่าสุดจาก Google Sheets สำเร็จ!", "success");
                    }
                } catch (err) { console.log("Could not auto-fetch:", err); } 
                finally { setIsLoadingSheet(false); }
            };

            const calculateStallBill = (stallNo, optionalMeterData = null) => {
                const user = users.find(u => u.stallNumber === stallNo) || { name: 'ผู้เช่าทั่วไป', rentOverride: rates.rentRate };
                const meters = (optionalMeterData || meterData)[stallNo] || { water: 0, electric: 0, status: 'ค้างชำระ' };
                const rent = Number(user.rentOverride) || Number(rates.rentRate);
                const waterAmount = (Number(meters.water) || 0) * Number(rates.waterRate);
                const electricAmount = (Number(meters.electric) || 0) * Number(rates.electricRate);
                const trashFee = Number(rates.trashFee);
                return {
                    stallNumber: stallNo, tenantName: user.name, rentRate: rent, waterUnits: Number(meters.water) || 0,
                    waterRate: rates.waterRate, waterAmount, electricUnits: Number(meters.electric) || 0,
                    electricRate: rates.electricRate, electricAmount, trashFee, totalAmount: rent + waterAmount + electricAmount + trashFee,
                    status: meters.status || 'ค้างชำระ', billingMonth: 'สิงหาคม 2026'
                };
            };

            const syncToGoogleSheets = async (customPayload = null, actionType = 'save_bills') => {
                if (!gasUrl) return showToast("ใส่ Google Web App URL ก่อนครับ", "error");
                setIsSyncing(true);
                try {
                    const payloadItems = customPayload || users.map(u => calculateStallBill(u.stallNumber));
                    await fetch(gasUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: actionType, items: payloadItems }) });
                    showToast("บันทึกส่ง Google Sheets เรียบร้อย!", "success");
                } catch (err) { showToast("เกิดข้อผิดพลาดในการเชื่อมต่อ", "error"); } 
                finally { setIsSyncing(false); }
            };

            const handleLogin = (e) => {
                e.preventDefault();
                const name = e.target.name.value.trim(); const password = e.target.password.value;
                const user = users.find(u => (u.name === name || u.stallNumber === name) && u.password === password);
                if (user) { setCurrentUser(user); setIsAuthenticated(true); setIsAdmin(false); setActiveTab('home'); showToast(`ยินดีต้อนรับ ${user.name}`, "success"); } 
                else { showToast("ชื่อผู้ใช้ หรือ รหัสผ่านไม่ถูกต้อง", "error"); }
            };

            const handleRegister = (e) => {
                e.preventDefault();
                const name = e.target.name.value.trim(); const password = e.target.password.value; const stallNumber = e.target.stallNumber.value.trim();
                if(users.find(u => u.name === name || u.stallNumber === stallNumber)) return showToast("ชื่อร้านหรือล็อคนี้ใช้งานแล้ว", "error");
                const updatedUsers = [...users, { id: Date.now(), name, password, stallNumber, rentOverride: rates.rentRate }];
                setUsers(updatedUsers);
                if(!meterData[stallNumber]) setMeterData({...meterData, [stallNumber]: { water: 0, electric: 0, status: 'ค้างชำระ' }});
                if(gasUrl) syncToGoogleSheets(updatedUsers, 'save_stores');
                showToast("ลงทะเบียนสำเร็จ กรุณาเข้าสู่ระบบ", "success"); setAuthMode('login');
            };

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (e.target.password.value === "887799") { setIsAuthenticated(true); setIsAdmin(true); setCurrentUser(null); showToast("เข้าสู่ระบบ Admin สำเร็จ", "success"); } 
                else { showToast("รหัสผ่านไม่ถูกต้อง", "error"); }
            };

            const handleLogout = () => { setIsAuthenticated(false); setIsAdmin(false); setCurrentUser(null); setAuthMode('login'); showToast("ออกจากระบบแล้ว", "info"); };

            const ctx = {
                toast, showToast, authMode, setAuthMode, isAuthenticated, setIsAuthenticated, isAdmin, setIsAdmin,
                currentUser, setCurrentUser, activeTab, setActiveTab, rates, setRates, gasUrl, setGasUrl,
                isSyncing, setIsSyncing, isLoadingSheet, setIsLoadingSheet, showGasScriptModal, setShowGasScriptModal,
                selectedInvoice, setSelectedInvoice, selectedReceipt, setSelectedReceipt,
                announcements, setAnnouncements, repairs, setRepairs, receipts, setReceipts, users, setUsers,
                meterData, setMeterData, fetchFromGoogleSheets, calculateStallBill, syncToGoogleSheets,
                handleLogout, handleLogin, handleRegister, handleAdminLogin, GOOGLE_APPS_SCRIPT_CODE
            };

            return (
                <div className="h-full w-full relative flex flex-col font-sans">
                    <div className={`absolute top-4 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 no-print ${toast.show ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-4 pointer-events-none'}`}>
                        <div className={`px-4 py-2.5 rounded-full shadow-lg text-xs font-bold ${toast.type === 'error' ? 'bg-red-500 text-white' : toast.type === 'success' ? 'bg-emerald-600 text-white' : 'bg-zinc-800 text-white'}`}>
                            {toast.message}
                        </div>
                    </div>

                    {!isAuthenticated ? <ViewAuth ctx={ctx} /> : isAdmin ? <ViewAdmin ctx={ctx} /> : <ViewHome ctx={ctx} />}

                    {isAuthenticated && !isAdmin && (
                        <div className="absolute bottom-0 w-full bg-white border-t border-zinc-200 px-4 py-2 flex justify-around items-center z-10 rounded-t-3xl shadow-lg no-print">
                            <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center gap-1 p-1 ${activeTab === 'home' ? 'text-zinc-900 font-bold' : 'text-zinc-400'}`}><IconHome /><span className="text-[9px]">หน้าหลัก</span></button>
                            <button onClick={() => setActiveTab('announcements')} className={`flex flex-col items-center gap-1 p-1 ${activeTab === 'announcements' ? 'text-zinc-900 font-bold' : 'text-zinc-400'}`}><IconMegaphone /><span className="text-[9px]">ประกาศ</span></button>
                            <button onClick={() => setActiveTab('repairs')} className={`flex flex-col items-center gap-1 p-1 ${activeTab === 'repairs' ? 'text-zinc-900 font-bold' : 'text-zinc-400'}`}><IconRepair /><span className="text-[9px]">แจ้งซ่อม</span></button>
                            <button onClick={() => setActiveTab('receipts')} className={`flex flex-col items-center gap-1 p-1 ${activeTab === 'receipts' ? 'text-zinc-900 font-bold' : 'text-zinc-400'}`}><IconReceipt /><span className="text-[9px]">ขอใบเสร็จ</span></button>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
