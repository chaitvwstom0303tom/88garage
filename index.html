<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>88 GARAGE - แอปผู้เช่าและแอดมิน</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #18181b; color: white; -webkit-tap-highlight-color: transparent; }
        .glass-panel { background: rgba(39, 39, 42, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const App = () => {
            // -- State สำหรับการ Login --
            const [currentUser, setCurrentUser] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);
            
            // -- State หลักของระบบ --
            const [gasUrl, setGasUrl] = useState(localStorage.getItem('gasUrl') || '');
            const [users, setUsers] = useState([]); // ร้านค้า
            const [repairs, setRepairs] = useState([]); // แจ้งซ่อม
            const [announcements, setAnnouncements] = useState([]); // ประกาศ
            const [bills, setBills] = useState([]); // บิลค่าเช่า/มิเตอร์ต่างๆ
            
            // -- State สำหรับ UI --
            const [toast, setToast] = useState(null);
            const [isSyncing, setIsSyncing] = useState(false);
            
            // แจ้งเตือน Toast
            const showToast = (msg, type = 'info') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 3000);
            };

            // ดึงข้อมูลจาก Google Sheets
            const fetchFromGoogleSheets = async () => {
                if (!gasUrl) return;
                setIsSyncing(true);
                try {
                    const res = await fetch(gasUrl);
                    const json = await res.json();
                    if (json.status === 'success') {
                        if (json.stores) setUsers(json.stores);
                        if (json.repairs) setRepairs(json.repairs.reverse());
                        if (json.announcements) setAnnouncements(json.announcements.reverse());
                        if (json.data) setBills(json.data); // ดึงข้อมูลบิลจาก Sheet "Bills" (ส่งมาในชื่อ data)
                        showToast("อัปเดตข้อมูลจากระบบเรียบร้อย", "success");
                    }
                } catch (err) {
                    console.error(err);
                    showToast("ไม่สามารถดึงข้อมูลได้ กรุณาตรวจสอบ URL", "error");
                } finally {
                    setIsSyncing(false);
                }
            };

            // โหลดข้อมูลครั้งแรก
            useEffect(() => {
                if (gasUrl) {
                    localStorage.setItem('gasUrl', gasUrl);
                    fetchFromGoogleSheets();
                }
            }, [gasUrl]);

            // บันทึกข้อมูลไป Google Sheets
            const syncToGoogleSheets = async (payload, actionType) => {
                if (!gasUrl) {
                    showToast("กรุณาตั้งค่า Google Sheets URL ในหน้า Admin ก่อน", "error");
                    return;
                }
                setIsSyncing(true);
                try {
                    // กรองรูปภาพออก ป้องกัน Payload ใหญ่เกินไป
                    const cleanPayload = payload.map(item => {
                        const cleanItem = { ...item };
                        if (cleanItem.photo) cleanItem.photo = "[แนบรูปภาพ - ดูผ่านแอป]";
                        return cleanItem;
                    });

                    await fetch(gasUrl, { 
                        method: 'POST', 
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
                        body: JSON.stringify({ action: actionType, items: cleanPayload }) 
                    });
                    
                    showToast("บันทึกข้อมูลเข้าระบบเรียบร้อย", "success");
                } catch (err) {
                    console.error(err);
                    showToast("เกิดข้อผิดพลาดในการบันทึก", "error");
                } finally {
                    setIsSyncing(false);
                }
            };

            if (!currentUser && !isAdmin) {
                return <LoginView 
                    users={users} 
                    onLoginTenant={(u) => setCurrentUser(u)}
                    onLoginAdmin={() => setIsAdmin(true)}
                    showToast={showToast}
                />;
            }

            const pendingRepairsCount = repairs.filter(r => r.status === 'รอดำเนินการ').length;

            return (
                <div className="min-h-screen pb-20 bg-zinc-900 text-zinc-100">
                    {/* Header */}
                    <div className="sticky top-0 z-40 bg-zinc-950/80 backdrop-blur-md border-b border-white/10 px-4 py-3 flex justify-between items-center">
                        <div className="flex items-center gap-2">
                            <div className="w-8 h-8 bg-yellow-500 rounded flex items-center justify-center font-black text-black">88</div>
                            <div>
                                <h1 className="text-sm font-bold leading-none">88 GARAGE</h1>
                                <p className="text-[10px] text-zinc-400">{isAdmin ? 'Admin Dashboard' : `ล็อค ${currentUser.stallNumber} - ${currentUser.name}`}</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-3">
                            {isSyncing && <div className="w-4 h-4 border-2 border-yellow-500 border-t-transparent rounded-full animate-spin"></div>}
                            <button onClick={() => { setCurrentUser(null); setIsAdmin(false); }} className="p-2 bg-red-500/10 text-red-400 rounded-lg text-xs font-bold">
                                ออกจากระบบ
                            </button>
                        </div>
                    </div>

                    {/* Content Area */}
                    <div className="p-4 max-w-lg mx-auto">
                        {isAdmin ? (
                            <AdminDashboard 
                                gasUrl={gasUrl} setGasUrl={setGasUrl} fetchFromGoogleSheets={fetchFromGoogleSheets}
                                users={users} setUsers={setUsers} syncToGoogleSheets={syncToGoogleSheets} showToast={showToast}
                                repairs={repairs} setRepairs={setRepairs} pendingRepairsCount={pendingRepairsCount}
                                bills={bills} setBills={setBills}
                                announcements={announcements} setAnnouncements={setAnnouncements}
                            />
                        ) : (
                            <TenantDashboard 
                                currentUser={currentUser} 
                                repairs={repairs} setRepairs={setRepairs} syncToGoogleSheets={syncToGoogleSheets} showToast={showToast}
                                bills={bills} announcements={announcements}
                            />
                        )}
                    </div>

                    {/* Toast Notification */}
                    {toast && (
                        <div className={`fixed top-16 left-1/2 transform -translate-x-1/2 z-50 px-4 py-2 rounded-full shadow-xl text-sm font-medium animate-bounce whitespace-nowrap ${toast.type === 'error' ? 'bg-red-500 text-white' : 'bg-green-500 text-white'}`}>
                            {toast.msg}
                        </div>
                    )}
                </div>
            );
        };

        const LoginView = ({ users, onLoginTenant, onLoginAdmin, showToast }) => {
            const [mode, setMode] = useState('tenant'); 
            const [stall, setStall] = useState('');
            const [password, setPassword] = useState('');

            const handleLogin = (e) => {
                e.preventDefault();
                if (mode === 'admin') {
                    if (password === '887799') onLoginAdmin();
                    else showToast('รหัสผ่าน Admin ไม่ถูกต้อง', 'error');
                } else {
                    // แก้ไข: ใช้ String() และ trim() เพื่อตัดช่องว่างที่อาจเผลอพิมพ์ ป้องกันปัญหาล็อกอินไม่ได้
                    const user = users.find(u => 
                        u && u.stallNumber && 
                        String(u.stallNumber).trim().toLowerCase() === stall.trim().toLowerCase() && 
                        String(u.password).trim() === password.trim()
                    );
                    
                    // เปิดช่องให้เทสถ้าไม่มีผู้ใช้ในระบบเลย (Bypass for testing)
                    if (user) {
                        onLoginTenant(user);
                    } else if (users.length === 0 && stall === 'A-01' && password === '123') {
                        onLoginTenant({ stallNumber: 'A-01', name: 'ร้านทดสอบ' });
                    } else {
                        showToast('ไม่พบข้อมูลล็อค หรือรหัสผ่านผิด', 'error');
                    }
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4 bg-zinc-950">
                    <div className="w-full max-w-sm glass-panel rounded-2xl p-6">
                        <div className="text-center mb-8">
                            <div className="w-16 h-16 bg-yellow-500 rounded-2xl mx-auto flex items-center justify-center text-3xl font-black text-black mb-4 shadow-[0_0_20px_rgba(234,179,8,0.3)]">88</div>
                            <h1 className="text-2xl font-black text-white tracking-wider">GARAGE</h1>
                            <p className="text-zinc-400 text-sm">ระบบจัดการพื้นที่เช่าตลาด</p>
                        </div>

                        <div className="flex bg-zinc-900 rounded-lg p-1 mb-6">
                            <button onClick={() => setMode('tenant')} className={`flex-1 py-2 text-sm font-bold rounded-md transition-all ${mode === 'tenant' ? 'bg-zinc-700 text-white shadow' : 'text-zinc-500'}`}>ผู้เช่า</button>
                            <button onClick={() => setMode('admin')} className={`flex-1 py-2 text-sm font-bold rounded-md transition-all ${mode === 'admin' ? 'bg-zinc-700 text-white shadow' : 'text-zinc-500'}`}>แอดมิน</button>
                        </div>

                        <form onSubmit={handleLogin} className="space-y-4">
                            {mode === 'tenant' && (
                                <div>
                                    <label className="text-xs text-zinc-400 font-medium mb-1 block">หมายเลขล็อค (เช่น A-01)</label>
                                    <input type="text" value={stall} onChange={e => setStall(e.target.value)} className="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-yellow-500" placeholder="A-01" required />
                                </div>
                            )}
                            <div>
                                <label className="text-xs text-zinc-400 font-medium mb-1 block">รหัสผ่าน</label>
                                <input type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-yellow-500" placeholder="••••••••" required />
                            </div>
                            <button type="submit" className="w-full bg-yellow-500 text-black font-bold py-3 rounded-xl hover:bg-yellow-400 transition-colors mt-2">
                                เข้าสู่ระบบ
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        const AdminDashboard = ({ gasUrl, setGasUrl, fetchFromGoogleSheets, users, setUsers, syncToGoogleSheets, showToast, repairs, setRepairs, pendingRepairsCount, bills, setBills, announcements, setAnnouncements }) => {
            const [tab, setTab] = useState('bills'); // Default to bills tab based on prompt focus
            
            // State สำหรับฟอร์มประกาศ
            const [newAnnounce, setNewAnnounce] = useState({ title: '', content: '' });

            // State สำหรับเพิ่มร้านค้า
            const [newStore, setNewStore] = useState({ stallNumber: '', name: '', password: '', rent: '' });

            // State สำหรับฟอร์มกรอกบิลค่าเช่า
            const [billForm, setBillForm] = useState({
                stallNumber: '', month: '', arrears: 0, waterUnits: 0, electricUnits: 0, commonFee: 0, internetFee: 0, otherFee: 0, status: 'รอชำระ'
            });

            const calculateTotalBill = (form) => {
                const waterFee = (Number(form.waterUnits) || 0) * 50;
                const electricFee = (Number(form.electricUnits) || 0) * 10;
                return (Number(form.arrears) || 0) + waterFee + electricFee + 
                       (Number(form.commonFee) || 0) + (Number(form.internetFee) || 0) + (Number(form.otherFee) || 0);
            };

            const handleBillSubmit = (e) => {
                e.preventDefault();
                if (!billForm.stallNumber || !billForm.month) return showToast("กรุณาเลือกล็อคและระบุเดือน", "error");

                const waterFee = (Number(billForm.waterUnits) || 0) * 50;
                const electricFee = (Number(billForm.electricUnits) || 0) * 10;
                const total = calculateTotalBill(billForm);
                
                const newBill = { 
                    ...billForm, 
                    waterFee: waterFee, 
                    electricFee: electricFee, 
                    totalAmount: total, 
                    id: `${billForm.stallNumber}-${billForm.month}` 
                };

                // อัปเดตบิล: ถ้าระบุล็อคและเดือนตรงกัน ให้แทนที่ของเดิม ถ้าไม่ตรงให้เพิ่มใหม่
                const updatedBills = bills.filter(b => b.id !== newBill.id);
                updatedBills.push(newBill);

                setBills(updatedBills);
                syncToGoogleSheets(updatedBills, 'save_bills');
                showToast("บันทึกข้อมูลบิลเรียบร้อย", "success");
            };

            const handleAddAnnounce = (e) => {
                e.preventDefault();
                if(!newAnnounce.title) return showToast("กรุณากรอกหัวข้อประกาศ", "error");
                
                const newItem = {
                    id: Date.now(),
                    date: new Date().toLocaleDateString('th-TH'),
                    title: newAnnounce.title,
                    content: newAnnounce.content
                };
                const updated = [newItem, ...announcements];
                setAnnouncements(updated);
                syncToGoogleSheets(updated, 'save_announcements');
                setNewAnnounce({ title: '', content: '' });
                showToast("เพิ่มประกาศเรียบร้อย", "success");
            };

            const handleAddStore = (e) => {
                e.preventDefault();
                if(!newStore.stallNumber || !newStore.name) return showToast("กรอกข้อมูลให้ครบ", "error");
                
                // แก้ไข: ตัดช่องว่าง (trim) ก่อนนำไปบันทึก เพื่อให้ตอนล็อกอินไม่ติด Error เว้นวรรค
                const cleanStore = {
                    ...newStore,
                    stallNumber: newStore.stallNumber.trim(),
                    password: newStore.password.trim(),
                    id: Date.now()
                };

                const updatedUsers = [...users, cleanStore];
                setUsers(updatedUsers);
                syncToGoogleSheets(updatedUsers, 'save_stores');
                setNewStore({ stallNumber: '', name: '', password: '', rent: '' });
                showToast("ลงทะเบียนร้านค้าเรียบร้อย", "success");
            };

            return (
                <div className="space-y-4">
                    {/* Admin Nav */}
                    <div className="flex overflow-x-auto hide-scrollbar gap-2 pb-2">
                        <NavBtn active={tab==='announcements'} onClick={() => setTab('announcements')} icon="📢" text="ประกาศ" />
                        <NavBtn active={tab==='bills'} onClick={() => setTab('bills')} icon="💰" text="จัดการบิล" />
                        <NavBtn active={tab==='stores'} onClick={() => setTab('stores')} icon="🏪" text="จัดการร้าน" />
                        <NavBtn active={tab==='repairs'} onClick={() => setTab('repairs')} icon="🛠️" text="งานซ่อม" badge={pendingRepairsCount} />
                        <NavBtn active={tab==='settings'} onClick={() => setTab('settings')} icon="⚙️" text="ระบบ" />
                    </div>

                    {/* Announcements Tab */}
                    {tab === 'announcements' && (
                        <div className="space-y-4">
                            <form onSubmit={handleAddAnnounce} className="glass-panel p-4 rounded-xl space-y-3">
                                <h2 className="font-bold text-yellow-500">📢 สร้างประกาศใหม่</h2>
                                <div>
                                    <label className="text-xs text-zinc-400">หัวข้อประกาศ</label>
                                    <input type="text" required value={newAnnounce.title} onChange={e=>setNewAnnounce({...newAnnounce, title: e.target.value})} className="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white" placeholder="เช่น แจ้งวันหยุดตลาด หรือ การจ่ายค่าเช่า" />
                                </div>
                                <div>
                                    <label className="text-xs text-zinc-400">รายละเอียด</label>
                                    <textarea required value={newAnnounce.content} onChange={e=>setNewAnnounce({...newAnnounce, content: e.target.value})} rows="3" className="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white" placeholder="พิมพ์รายละเอียดประกาศ..."></textarea>
                                </div>
                                <button type="submit" className="w-full bg-yellow-500 text-black font-bold py-2 rounded-lg text-sm">กระจายประกาศ</button>
                            </form>

                            <div className="glass-panel p-4 rounded-xl space-y-3">
                                <h2 className="font-bold text-yellow-500">ประวัติประกาศ</h2>
                                {announcements.length === 0 ? <p className="text-sm text-zinc-500">ยังไม่มีประกาศ</p> : (
                                    <div className="space-y-2">
                                        {announcements.map(a => (
                                            <div key={a.id} className="bg-zinc-900 p-3 rounded-lg border border-zinc-800">
                                                <div className="text-xs text-zinc-400 mb-1">{a.date}</div>
                                                <div className="font-bold text-sm text-white">{a.title}</div>
                                                <p className="text-xs text-zinc-400 mt-1">{a.content}</p>
                                                <button onClick={() => {
                                                    const updated = announcements.filter(x => x.id !== a.id);
                                                    setAnnouncements(updated);
                                                    syncToGoogleSheets(updated, 'save_announcements');
                                                }} className="text-xs text-red-500 bg-red-500/10 px-2 py-1 rounded mt-2">ลบประกาศ</button>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Bills Tab (ใหม่) */}
                    {tab === 'bills' && (
                        <div className="space-y-4">
                            <form onSubmit={handleBillSubmit} className="glass-panel p-4 rounded-xl space-y-3">
                                <h2 className="font-bold text-yellow-500">กรอกข้อมูลบิล / ค่าเช่า</h2>
                                
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="text-xs text-zinc-400">เลือกล็อคเช่า</label>
                                        <select required value={billForm.stallNumber} onChange={e => setBillForm({...billForm, stallNumber: e.target.value})} className="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white">
                                            <option value="">-- เลือกล็อค --</option>
                                            {users.map((u, i) => <option key={i} value={u.stallNumber}>{u.stallNumber} ({u.name})</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-xs text-zinc-400">ประจำเดือน</label>
                                        <input type="month" required value={billForm.month} onChange={e => setBillForm({...billForm, month: e.target.value})} className="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm" />
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 gap-3 mt-2">
                                    <div>
                                        <label className="text-xs text-zinc-400">ค่าเช่าค้างชำระ (บาท)</label>
                                        <input type="number" min="0" value={billForm.arrears} onChange={e => setBillForm({...billForm, arrears: e.target.value})} className="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm" />
                                    </div>
                                    <div>
                                        <label className="text-xs text-zinc-400">ค่าไฟ (หน่วยละ 10 บาท)</label>
                                        <input type="number" min="0" value={billForm.electricUnits} onChange={e => setBillForm({...billForm, electricUnits: e.target.value})} className="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm" placeholder="จำนวนหน่วย" />
                                    </div>
                                    <div>
                                        <label className="text-xs text-zinc-400">ค่าน้ำ (หน่วยละ 50 บาท)</label>
                                        <input type="number" min="0" value={billForm.waterUnits} onChange={e => setBillForm({...billForm, waterUnits: e.target.value})} className="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm" placeholder="จำนวนหน่วย" />
                                    </div>
                                    <div>
                                        <label className="text-xs text-zinc-400">ค่าส่วนกลาง (บาท)</label>
                                        <input type="number" min="0" value={billForm.commonFee} onChange={e => setBillForm({...billForm, commonFee: e.target.value})} className="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm" />
                                    </div>
                                    <div>
                                        <label className="text-xs text-zinc-400">ค่าอินเทอร์เน็ต (บาท)</label>
                                        <input type="number" min="0" value={billForm.internetFee} onChange={e => setBillForm({...billForm, internetFee: e.target.value})} className="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm" />
                                    </div>
                                    <div>
                                        <label className="text-xs text-zinc-400">ค่าบริการอื่นๆ (บาท)</label>
                                        <input type="number" min="0" value={billForm.otherFee} onChange={e => setBillForm({...billForm, otherFee: e.target.value})} className="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm" />
                                    </div>
                                </div>

                                <div className="bg-yellow-500/10 border border-yellow-500/30 p-3 rounded-lg flex justify-between items-center mt-2">
                                    <span className="text-sm text-yellow-500 font-bold">ยอดรวมสุทธิ</span>
                                    <span className="text-xl font-black text-white">฿{calculateTotalBill(billForm).toLocaleString()}</span>
                                </div>

                                <button type="submit" className="w-full bg-yellow-500 text-black font-bold py-3 rounded-lg text-sm mt-2 shadow-[0_0_15px_rgba(234,179,8,0.2)]">
                                    บันทึกข้อมูลบิลส่งให้ผู้เช่า
                                </button>
                            </form>

                            <div className="glass-panel p-4 rounded-xl space-y-3">
                                <h2 className="font-bold text-yellow-500">ประวัติบิลที่บันทึกแล้ว</h2>
                                {bills.length === 0 ? <p className="text-sm text-zinc-500">ยังไม่มีข้อมูลบิล</p> : (
                                    <div className="space-y-2">
                                        {bills.slice().reverse().map((b, i) => (
                                            <div key={i} className="bg-zinc-900 p-3 rounded-lg border border-zinc-800 flex justify-between items-center">
                                                <div>
                                                    <div className="font-bold text-sm text-white">ล็อค {b.stallNumber} <span className="text-xs text-zinc-400 font-normal">({b.month})</span></div>
                                                    <div className="text-xs text-zinc-500">ยอดรวม: ฿{(Number(b.totalAmount)||0).toLocaleString()}</div>
                                                </div>
                                                <span className={`text-[10px] px-2 py-1 rounded-full font-bold ${b.status === 'ชำระแล้ว' ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'}`}>
                                                    {b.status || 'รอชำระ'}
                                                </span>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Stores Tab */}
                    {tab === 'stores' && (
                        <div className="space-y-4">
                            <form onSubmit={handleAddStore} className="glass-panel p-4 rounded-xl space-y-3">
                                <h2 className="font-bold text-yellow-500">ลงทะเบียนร้านค้าใหม่</h2>
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="text-xs text-zinc-400">หมายเลขล็อค</label>
                                        <input type="text" required value={newStore.stallNumber} onChange={e=>setNewStore({...newStore, stallNumber: e.target.value})} className="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm" placeholder="A-01" />
                                    </div>
                                    <div>
                                        <label className="text-xs text-zinc-400">ชื่อร้าน</label>
                                        <input type="text" required value={newStore.name} onChange={e=>setNewStore({...newStore, name: e.target.value})} className="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm" placeholder="ชื่อร้าน" />
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="text-xs text-zinc-400">รหัสผ่าน</label>
                                        <input type="text" required value={newStore.password} onChange={e=>setNewStore({...newStore, password: e.target.value})} className="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm" placeholder="1234" />
                                    </div>
                                    <div>
                                        <label className="text-xs text-zinc-400">ค่าเช่าพื้นฐาน</label>
                                        <input type="number" required value={newStore.rent} onChange={e=>setNewStore({...newStore, rent: e.target.value})} className="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm" placeholder="3000" />
                                    </div>
                                </div>
                                <button type="submit" className="w-full bg-yellow-500 text-black font-bold py-2 rounded-lg text-sm">บันทึกร้านค้า</button>
                            </form>

                            <div className="glass-panel p-4 rounded-xl">
                                <h2 className="font-bold text-yellow-500 mb-3">รายชื่อร้านค้า ({users.length})</h2>
                                <div className="space-y-2">
                                    {users.map((u, i) => (
                                        <div key={i} className="bg-zinc-900 p-3 rounded-lg flex justify-between items-center border border-zinc-800">
                                            <div>
                                                <div className="font-bold text-sm text-white">{u.stallNumber} - {u.name}</div>
                                                <div className="text-xs text-zinc-400">รหัส: {u.password} | ค่าเช่า: ฿{u.rent}</div>
                                            </div>
                                            <button onClick={() => {
                                                const updated = users.filter(x => x.stallNumber !== u.stallNumber);
                                                setUsers(updated);
                                                syncToGoogleSheets(updated, 'save_stores');
                                            }} className="text-xs text-red-500 bg-red-500/10 px-2 py-1 rounded">ลบ</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Repairs Tab */}
                    {tab === 'repairs' && (
                        <div className="space-y-4">
                            <h2 className="font-bold text-yellow-500">รายการแจ้งซ่อม</h2>
                            {repairs.length === 0 ? <p className="text-sm text-zinc-500">ไม่มีรายการ</p> : (
                                <div className="space-y-3">
                                    {repairs.map(r => (
                                        <div key={r.id} className="glass-panel p-4 rounded-xl border border-zinc-700">
                                            <div className="flex justify-between items-start mb-2">
                                                <div>
                                                    <span className={`text-[10px] font-black px-2 py-0.5 rounded-full ${r.status === 'รอดำเนินการ' ? 'bg-red-500/20 text-red-400' : r.status === 'กำลังดำเนินการ' ? 'bg-yellow-500/20 text-yellow-400' : 'bg-green-500/20 text-green-400'}`}>
                                                        {r.status}
                                                    </span>
                                                    <div className="font-bold text-sm mt-1">ล็อค {r.stallNumber}</div>
                                                    <div className="text-xs text-zinc-400">{r.date}</div>
                                                </div>
                                            </div>
                                            <p className="text-sm bg-zinc-900 p-2 rounded text-zinc-300">{r.desc}</p>
                                            
                                            <div className="pt-3 mt-3 border-t border-zinc-700">
                                                <select value={r.status} onChange={(e) => {
                                                    const updated = repairs.map(x => x.id === r.id ? {...x, status: e.target.value} : x);
                                                    setRepairs(updated);
                                                    syncToGoogleSheets(updated, 'save_repairs');
                                                }} className="w-full bg-zinc-800 text-xs rounded px-3 py-2 border border-zinc-600 outline-none text-white">
                                                    <option value="รอดำเนินการ">รอดำเนินการ</option>
                                                    <option value="กำลังดำเนินการ">กำลังดำเนินการ</option>
                                                    <option value="แก้ไขแล้ว">แก้ไขแล้ว</option>
                                                </select>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}

                    {/* Settings Tab */}
                    {tab === 'settings' && (
                        <div className="glass-panel p-4 rounded-xl space-y-4">
                            <h2 className="font-bold text-yellow-500">⚙️ การเชื่อมต่อฐานข้อมูล (Google Sheets)</h2>
                            <p className="text-xs text-zinc-400">ใส่ Web App URL ที่ได้จาก Google Apps Script</p>
                            <input type="text" value={gasUrl} onChange={e => setGasUrl(e.target.value)} placeholder="https://script.google.com/..." className="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white" />
                            <button onClick={fetchFromGoogleSheets} className="w-full bg-zinc-700 text-white font-bold py-2 rounded-lg text-sm">
                                ดึงข้อมูลล่าสุด (Sync)
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        const TenantDashboard = ({ currentUser, repairs, setRepairs, syncToGoogleSheets, showToast, bills, announcements }) => {
            const [tab, setTab] = useState('home'); // เปลี่ยนแท็บเริ่มต้นเป็นหน้าแรก (home)
            const [desc, setDesc] = useState('');

            const handleRepairSubmit = (e) => {
                e.preventDefault();
                if (!desc) return;
                const newRepair = {
                    id: Date.now(), stallNumber: currentUser.stallNumber, name: currentUser.name,
                    desc: desc, status: 'รอดำเนินการ', date: new Date().toLocaleString('th-TH')
                };
                const updated = [newRepair, ...repairs];
                setRepairs(updated);
                syncToGoogleSheets(updated, 'save_repairs');
                setDesc('');
                setTab('myrepairs');
                showToast('ส่งแจ้งซ่อมแล้ว', 'success');
            };

            // หากข้อมูลบิลของล็อคนี้ (เอาบิลล่าสุดมาแสดง)
            const myBills = bills.filter(b => b.stallNumber === currentUser.stallNumber);
            const latestBill = myBills[myBills.length - 1]; // รายการล่าสุด

            return (
                <div className="space-y-4">
                    {/* Tenant Nav */}
                    <div className="flex overflow-x-auto hide-scrollbar gap-2 pb-2">
                        <NavBtn active={tab==='home'} onClick={() => setTab('home')} icon="📢" text="หน้าหลัก" />
                        <NavBtn active={tab==='bill'} onClick={() => setTab('bill')} icon="🧾" text="บิล/ค่าเช่า" />
                        <NavBtn active={tab==='repair'} onClick={() => setTab('repair')} icon="🛠️" text="แจ้งซ่อม" />
                        <NavBtn active={tab==='myrepairs'} onClick={() => setTab('myrepairs')} icon="📋" text="ประวัติซ่อม" />
                    </div>

                    {/* Home / Announcements Tab */}
                    {tab === 'home' && (
                        <div className="space-y-4">
                            <h2 className="font-bold text-yellow-500">📢 ประกาศจากตลาด</h2>
                            
                            {announcements.length === 0 ? (
                                <div className="glass-panel p-8 text-center rounded-xl border border-zinc-700">
                                    <div className="text-4xl mb-2 opacity-50">📭</div>
                                    <p className="text-zinc-400 text-sm">ยังไม่มีประกาศในขณะนี้</p>
                                </div>
                            ) : (
                                <div className="space-y-3">
                                    {announcements.map(a => (
                                        <div key={a.id} className="glass-panel p-5 rounded-xl border border-zinc-700 shadow-lg relative overflow-hidden">
                                            <div className="absolute top-0 left-0 w-1 h-full bg-yellow-500"></div>
                                            <div className="text-xs text-zinc-400 mb-1 flex items-center gap-1">
                                                <span>🗓️</span> {a.date}
                                            </div>
                                            <h3 className="font-bold text-white text-lg leading-tight mb-2">{a.title}</h3>
                                            <p className="text-sm text-zinc-300 whitespace-pre-line">{a.content}</p>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}

                    {/* Bill View Tab */}
                    {tab === 'bill' && (
                        <div className="space-y-4">
                            <h2 className="font-bold text-yellow-500">สรุปยอดบิลประจำเดือน</h2>
                            
                            {!latestBill ? (
                                <div className="glass-panel p-8 text-center rounded-xl border border-zinc-700">
                                    <div className="text-4xl mb-2 opacity-50">🧾</div>
                                    <p className="text-zinc-400 text-sm">ยังไม่มีข้อมูลบิลสำหรับล็อคนี้</p>
                                    <p className="text-zinc-500 text-xs mt-1">กรุณารอแอดมินอัปเดตข้อมูล</p>
                                </div>
                            ) : (
                                <div className="glass-panel rounded-xl overflow-hidden shadow-2xl border border-zinc-700">
                                    <div className="bg-zinc-800 p-4 border-b border-zinc-700 flex justify-between items-center">
                                        <div>
                                            <h3 className="font-bold text-white">บิลประจำเดือน {latestBill.month}</h3>
                                            <p className="text-xs text-zinc-400">หมายเลขล็อค: {latestBill.stallNumber}</p>
                                        </div>
                                        <span className={`text-xs px-3 py-1 rounded-full font-bold ${latestBill.status === 'ชำระแล้ว' ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'}`}>
                                            {latestBill.status || 'รอชำระ'}
                                        </span>
                                    </div>
                                    
                                    <div className="p-4 space-y-3 bg-zinc-900">
                                        <div className="flex justify-between text-sm">
                                            <span className="text-zinc-400">ค่าเช่าค้างชำระ:</span>
                                            <span className="text-white">฿{(Number(latestBill.arrears)||0).toLocaleString()}</span>
                                        </div>
                                        <div className="flex justify-between text-sm">
                                            <span className="text-zinc-400">ค่าไฟประจำเดือน {latestBill.electricUnits !== undefined ? `(${latestBill.electricUnits} หน่วย)` : ''}:</span>
                                            <span className="text-white">฿{(Number(latestBill.electricFee)||0).toLocaleString()}</span>
                                        </div>
                                        <div className="flex justify-between text-sm">
                                            <span className="text-zinc-400">ค่าน้ำประจำเดือน {latestBill.waterUnits !== undefined ? `(${latestBill.waterUnits} หน่วย)` : ''}:</span>
                                            <span className="text-white">฿{(Number(latestBill.waterFee)||0).toLocaleString()}</span>
                                        </div>
                                        <div className="flex justify-between text-sm">
                                            <span className="text-zinc-400">ค่าส่วนกลาง:</span>
                                            <span className="text-white">฿{(Number(latestBill.commonFee)||0).toLocaleString()}</span>
                                        </div>
                                        <div className="flex justify-between text-sm">
                                            <span className="text-zinc-400">ค่าอินเทอร์เน็ต:</span>
                                            <span className="text-white">฿{(Number(latestBill.internetFee)||0).toLocaleString()}</span>
                                        </div>
                                        <div className="flex justify-between text-sm">
                                            <span className="text-zinc-400">ค่าบริการอื่นๆ:</span>
                                            <span className="text-white">฿{(Number(latestBill.otherFee)||0).toLocaleString()}</span>
                                        </div>
                                    </div>
                                    
                                    <div className="bg-yellow-500 p-4 flex justify-between items-center text-black">
                                        <span className="font-bold text-sm">สรุปยอดรวมทั้งสิ้น</span>
                                        <span className="text-2xl font-black">฿{(Number(latestBill.totalAmount)||0).toLocaleString()}</span>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* Submit Repair */}
                    {tab === 'repair' && (
                        <form onSubmit={handleRepairSubmit} className="glass-panel p-4 rounded-xl space-y-4">
                            <h2 className="font-bold text-yellow-500">🛠️ แจ้งปัญหา / ซ่อมแซม</h2>
                            <textarea required value={desc} onChange={e=>setDesc(e.target.value)} rows="4" className="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-white" placeholder="อธิบายปัญหาที่พบ..."></textarea>
                            <button type="submit" className="w-full bg-yellow-500 text-black font-bold py-3 rounded-lg text-sm">ส่งเรื่องแจ้งซ่อม</button>
                        </form>
                    )}

                    {/* My Repairs */}
                    {tab === 'myrepairs' && (
                        <div className="space-y-3">
                            <h2 className="font-bold text-yellow-500">ประวัติแจ้งซ่อมของคุณ</h2>
                            {repairs.filter(r => r.stallNumber === currentUser.stallNumber).length === 0 ? 
                                <p className="text-sm text-zinc-500 text-center py-4 glass-panel rounded-xl">ไม่มีประวัติแจ้งเรื่อง</p> : 
                                repairs.filter(r => r.stallNumber === currentUser.stallNumber).map(r => (
                                <div key={r.id} className="glass-panel p-4 rounded-xl border border-zinc-700">
                                    <div className="flex justify-between items-start mb-2">
                                        <div className="text-xs text-zinc-400">{r.date}</div>
                                        <span className={`text-[10px] font-black px-2 py-0.5 rounded-full ${r.status === 'รอดำเนินการ' ? 'bg-red-500/20 text-red-400' : r.status === 'กำลังดำเนินการ' ? 'bg-yellow-500/20 text-yellow-400' : 'bg-green-500/20 text-green-400'}`}>
                                            {r.status}
                                        </span>
                                    </div>
                                    <p className="text-sm text-white bg-zinc-900 p-2 rounded">{r.desc}</p>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        // UI Component: Navigation Button
        const NavBtn = ({ active, onClick, icon, text, badge }) => (
            <button onClick={onClick} className={`relative flex flex-col items-center justify-center min-w-[70px] py-2 px-3 rounded-xl transition-all ${active ? 'bg-yellow-500/20 text-yellow-400 border border-yellow-500/30' : 'bg-zinc-800 text-zinc-400 border border-transparent'}`}>
                <span className="text-xl mb-1">{icon}</span>
                <span className="text-[10px] font-bold">{text}</span>
                {badge > 0 && <span className="absolute top-1 right-1 bg-red-500 text-white text-[9px] font-black w-4 h-4 flex items-center justify-center rounded-full shadow">{badge}</span>}
            </button>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
